<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEVA | لم يتم اضافة محتوى بعد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<style>
:root{
    --bg1:#07233b;
    --bg2:#020b16;
    --cyan:#00ffff;
    --blue:#00aaff;
    --text:#e6fbff;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Cairo",sans-serif;}
body{
    min-height:100vh;
    background:radial-gradient(circle at top,var(--bg1),var(--bg2) 70%);
    color:var(--text);
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
}
#particles-js{position:fixed;inset:0;z-index:0;opacity:0.6;}

/* NAVBAR */
.navbar{
    position:sticky;top:0;z-index:1000;
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 6%;
    background:rgba(5,10,25,0.6);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(0,255,255,0.1);
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.brand-logo{height:48px;width:auto;filter:drop-shadow(0 0 8px rgba(0,170,255,0.5));transition:.3s;}
.brand-logo:hover{filter:drop-shadow(0 0 14px rgba(0,255,255,0.9));}
.brand-text{display:flex;flex-direction:column;line-height:1.1;}
.brand-name{
    font-family:"Orbitron",sans-serif;
    font-size:1.4rem;font-weight:900;letter-spacing:3px;
    background:linear-gradient(90deg,#fff,var(--cyan));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.brand-tag{font-size:0.6rem;letter-spacing:2px;color:#9fb3c8;text-transform:uppercase;}
.navbar ul{display:flex;gap:10px;list-style:none;}
.navbar a.nav-link{
    text-decoration:none;color:white;
    padding:8px 14px;border-radius:10px;
    background:rgba(255,255,255,0.05);
    transition:.3s;font-size:0.95rem;
}
.navbar a.nav-link:hover{background:var(--cyan);color:#001018;}

/* MAIN */
.main{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:40px 20px;position:relative;z-index:2;
}
.placeholder-card{
    background:rgba(10,15,30,0.75);
    backdrop-filter:blur(14px);
    border:1px solid rgba(0,255,255,0.15);
    border-radius:24px;
    padding:50px 40px;text-align:center;
    max-width:520px;width:100%;
    box-shadow:0 0 40px rgba(0,170,255,0.1);
    animation:cardFloat 5s ease-in-out infinite;
}
@keyframes cardFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.placeholder-logo{
    width:130px;margin:0 auto 25px;display:block;
    filter:drop-shadow(0 0 20px rgba(0,170,255,0.6));
    animation:logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse{
    0%,100%{filter:drop-shadow(0 0 20px rgba(0,170,255,0.6));}
    50%{filter:drop-shadow(0 0 30px rgba(0,255,255,0.9));}
}
.placeholder-icon{
    font-size:3rem;margin-bottom:15px;display:block;
    animation:iconBounce 2s ease-in-out infinite;
}
@keyframes iconBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.placeholder-title{
    font-size:1.7rem;font-weight:700;color:var(--cyan);
    margin-bottom:10px;letter-spacing:0.5px;
}
.placeholder-subtitle{
    font-size:0.95rem;color:#9fb3c8;margin-bottom:25px;line-height:1.6;
}

/* BACK BUTTON */
.btn-back{
    display:inline-block;padding:11px 28px;border-radius:12px;
    text-decoration:none;font-weight:700;font-size:0.9rem;
    background:var(--cyan);color:#001018;transition:.3s;
    box-shadow:0 0 20px rgba(0,255,255,0.3);
}
.btn-back:hover{
    filter:brightness(1.2);transform:translateY(-2px);
    box-shadow:0 0 30px rgba(0,255,255,0.5);
}

/* FOOTER */
.footer{
    text-align:center;padding:18px;
    background:rgba(0,0,0,0.4);color:#9fb3c8;
    position:relative;z-index:2;font-size:0.85rem;
}
@media(max-width:600px){
    .navbar{flex-direction:column;gap:10px;}
    .brand-logo{height:40px;}
    .placeholder-logo{width:95px;}
    .placeholder-title{font-size:1.3rem;}
    .placeholder-card{padding:35px 22px;}
}
</style>
</head>
