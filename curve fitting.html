<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل ملاءمة المنحنيات | Curve Fitting Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-cyan: #00f2fe;
            --dark-cyan: #083344;
            --bg-deep: #020617;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(34, 211, 238, 0.2);
            --pink: #ff0077;
        }

        body {
            background: radial-gradient(circle at top, #0f172a, var(--bg-deep));
            color: white;
            font-family: 'Tajawal', sans-serif;
            margin: 0; 
            padding: 10px; /* تقليل الحواف للموبايل */
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container { 
            width: 100%; 
            max-width: 1100px; 
        }

        /* زر الرجوع المتجاوب */
        .top-nav {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 15px;
        }

        .btn-back {
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--primary-cyan);
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            font-size: 14px;
            backdrop-filter: blur(10px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* الكروت الزجاجية */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        .header { text-align: center; margin-bottom: 25px; padding: 0 10px; }
        .header h1 { 
            background: linear-gradient(90deg, #fff, var(--primary-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0; 
            font-size: clamp(1.5rem, 5vw, 2.5rem); /* حجم خط مرن */
        }
        .header p { font-size: clamp(0.85rem, 3vw, 1rem); }

        /* تخطيط الشبكة المتجاوب */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr; /* عمود واحد للموبايل افتراضياً */
            gap: 20px;
        }

        /* شاشات اللابتوب والتابلت العريض */
        @media (min-width: 992px) {
            .grid-layout {
                grid-template-columns: 380px 1fr; /* توزيع جانبي للابتوب */
            }
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 0.9rem; }
        
        textarea {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--primary-cyan);
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 16px; /* منع الزووم التلقائي في الآيفون */
            resize: vertical;
            box-sizing: border-box;
        }

        .btn-calc {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, var(--primary-cyan), #4facfe);
            border: none; border-radius: 12px;
            color: var(--dark-cyan); font-weight: bold;
            cursor: pointer; transition: 0.3s;
            font-size: 16px;
            margin-top: 10px;
        }

        /* صندوق النتائج */
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(34, 211, 238, 0.1);
            border-radius: 12px;
            border-right: 4px solid var(--primary-cyan);
        }

        .equation { 
            font-family: 'Courier New', monospace; 
            font-size: clamp(1rem, 4vw, 1.2rem); 
            color: #fff; 
            word-break: break-all; /* كسر النص الطويل في الموبايل */
        }

        /* حاوية الرسم البياني المتجاوبة */
        .chart-container { 
            position: relative; 
            height: 300px; /* ارتفاع أصغر للموبايل */
            width: 100%; 
        }

        @media (min-width: 768px) {
            .chart-container { height: 450px; } /* ارتفاع أكبر للتابلت واللابتوب */
        }

        footer { margin: 30px 0; color: #64748b; font-size: 12px; text-align: center; }

        /* لمسات إضافية للجوال */
        @media (max-width: 480px) {
            body { padding: 15px 10px; }
            .glass-card { padding: 15px; }
            .btn-back { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <a href="dashboard.html" class="btn-back">
            <span>&#10095;</span>
            العودة للوحة التحكم
        </a>
    </div>

    <div class="header">
        <h1>Curve Fitting Analyzer</h1>
        <p style="color: #64748b;">تحليل الانحدار الخطي للبيانات بدقة عالية</p>
    </div>

    <div class="grid-layout">
        <div class="glass-card">
            <div class="input-group">
                <label>إحداثيات X (قيم مستقلة):</label>
                <textarea id="xValues" rows="3">1, 2, 3, 4, 5, 6</textarea>
            </div>
            <div class="input-group">
                <label>إحداثيات Y (قيم تابعة):</label>
                <textarea id="yValues" rows="3">2.2, 3.8, 6.5, 8.0, 10.2, 12.1</textarea>
            </div>
            <button class="btn-calc" onclick="calculateFit()">إجراء التحليل الرياضي ✨</button>

            <div id="results" class="result-box" style="display:none;">
                <label>معادلة الخط المستقيم:</label>
                <div class="equation" id="eqText">y = mx + c</div>
                <div style="display: flex; justify-content: space-between; font-size: 13px; margin-top: 10px;">
                    <span style="color: #94a3b8;">الدقة (R²):</span>
                    <span id="rSquared" style="color: var(--primary-cyan); font-weight: bold;">0</span>
                </div>
                
                <button class="btn-export" onclick="exportChart()" style="width: 100%; margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--primary-cyan); border-radius: 8px; color: var(--primary-cyan); cursor: pointer;">
                    📥 حفظ الرسم كصورة
                </button>
            </div>
        </div>

        
        <div class="glass-card">
            <div class="chart-container">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </div>
</div>

<footer>
    نظام تحليل البيانات | مبرمج بواسطة <b>Ahmed El_Samahy</b> | 2026 ©
</footer>

<script>
    let chart;

    function calculateFit() {
        const xRaw = document.getElementById('xValues').value.split(/[\s,]+/).filter(v => v !== "").map(Number);
        const yRaw = document.getElementById('yValues').value.split(/[\s,]+/).filter(v => v !== "").map(Number);

        if (xRaw.length !== yRaw.length || xRaw.length < 2) {
            alert("⚠️ تنبيه: يرجى إدخال عدد متساوٍ من قيم X و Y.");
            return;
        }

        const n = xRaw.length;
        let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0, sumY2 = 0;

        for (let i = 0; i < n; i++) {
            sumX += xRaw[i];
            sumY += yRaw[i];
            sumXY += xRaw[i] * yRaw[i];
            sumX2 += xRaw[i] * xRaw[i];
            sumY2 += yRaw[i] * yRaw[i];
        }

        const m = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
        const c = (sumY - m * sumX) / n;
        const rVal = (n * sumXY - sumX * sumY) / Math.sqrt((n * sumX2 - sumX * sumX) * (n * sumY2 - sumY * sumY));
        const r2 = Math.pow(rVal, 2);

        document.getElementById('results').style.display = 'block';
        const sign = c >= 0 ? "+" : "-";
        document.getElementById('eqText').innerText = `y = ${m.toFixed(3)}x ${sign} ${Math.abs(c).toFixed(3)}`;
        document.getElementById('rSquared').innerText = (r2 * 100).toFixed(2) + "%";

        renderChart(xRaw, yRaw, m, c);
    }

    function renderChart(xRaw, yRaw, m, c) {
        const minX = Math.min(...xRaw);
        const maxX = Math.max(...xRaw);
        const trendLine = [
            { x: minX, y: m * minX + c },
            { x: maxX, y: m * maxX + c }
        ];

        if (chart) chart.destroy();

        const ctx = document.getElementById('myChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [{
                    label: 'البيانات',
                    data: xRaw.map((x, i) => ({ x: x, y: yRaw[i] })),
                    backgroundColor: '#00f2fe'
                }, {
                    label: 'خط الانحدار',
                    data: trendLine,
                    type: 'line',
                    borderColor: '#ff0077',
                    pointRadius: 0,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#fff' } } },
                scales: {
                    x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                    y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                }
            }
        });
    }

    function exportChart() {
        const link = document.createElement('a');
        link.download = 'Curve-Analysis.png';
        link.href = chart.toBase64Image();
        link.click();
    }

    window.onload = calculateFit;
</script>
</body>
</html>
