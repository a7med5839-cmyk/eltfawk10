<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كويز حقوق الإنسان - الرحلة الفضائية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #030014;
            --bg2: #0a0a1f;
            --card: rgba(15, 15, 35, 0.8);
            --card-hover: rgba(25, 25, 55, 0.9);
            --border: rgba(0, 210, 255, 0.2);
            --fg: #e8f4ff;
            --muted: #7a9cc6;
            --accent: #00d2ff;
            --accent2: #0099cc;
            --accent-glow: rgba(0, 210, 255, 0.25);
            --wrong: #ff3366;
            --wrong-glow: rgba(255, 51, 102, 0.25);
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.2);
            --purple: #9d00ff;
            --purple-glow: rgba(157, 0, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* === الخلفية الفضائية === */
        .space-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(157, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 210, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 10, 40, 1) 0%, var(--bg) 100%);
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: var(--opacity); transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
        }

        .shooting-star {
            position: fixed;
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), transparent);
            opacity: 0;
            animation: shoot 3s ease-in-out infinite;
        }

        @keyframes shoot {
            0% { transform: translateX(0) translateY(0); opacity: 0; }
            5% { opacity: 1; }
            15% { transform: translateX(-300px) translateY(300px); opacity: 0; }
            100% { opacity: 0; }
        }

        .nebula {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: nebulaFloat 30s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .nebula-1 {
            top: -200px;
            right: -200px;
            background: radial-gradient(circle, var(--purple) 0%, transparent 70%);
        }

        .nebula-2 {
            bottom: -200px;
            left: -200px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            animation-delay: -15s;
        }

        @keyframes nebulaFloat {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(50px, 30px) rotate(180deg); }
            100% { transform: translate(-30px, 50px) rotate(360deg); }
        }

        /* === الحاوية الرئيسية === */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: warpIn 0.6s ease-out; }

        @keyframes warpIn {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        /* === الشاشة الرئيسية === */
        .home-header {
            text-align: center;
            padding: 60px 0 40px;
        }

        .planet-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 30px;
        }

        .planet {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            box-shadow: 
                0 0 60px var(--accent-glow),
                inset -20px -20px 40px rgba(0,0,0,0.4),
                inset 10px 10px 20px rgba(255,255,255,0.1);
            animation: planetPulse 4s ease-in-out infinite, planetRotate 20s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: white;
        }

        .planet-ring {
            position: absolute;
            inset: -15px;
            border: 2px solid rgba(0, 210, 255, 0.3);
            border-radius: 50%;
            animation: ringRotate 10s linear infinite;
        }

        .planet-ring::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -5px;
            right: -5px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            transform: rotateX(75deg);
        }

        @keyframes planetPulse {
            0%, 100% { box-shadow: 0 0 60px var(--accent-glow); }
            50% { box-shadow: 0 0 100px rgba(0, 210, 255, 0.4); }
        }

        @keyframes planetRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes ringRotate {
            from { transform: rotateX(75deg) rotateZ(0deg); }
            to { transform: rotateX(75deg) rotateZ(360deg); }
        }

        .home-header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--fg), var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 30px var(--accent-glow);
        }

        .home-header p {
            color: var(--muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 30px 0 40px;
            padding: 20px 30px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .stat-item { text-align: center; }

        .stat-item .num {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-item .label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 4px;
        }

        /* === بطاقات المستويات === */
        .levels-grid {
            display: grid;
            gap: 18px;
        }

        .level-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .level-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, var(--accent-glow));
            opacity: 0;
            transition: opacity 0.4s;
        }

        .level-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.6s;
        }

        .level-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 
                0 20px 40px rgba(0, 210, 255, 0.15),
                0 0 20px var(--accent-glow);
        }

        .level-card:hover::before { opacity: 1; }
        .level-card:hover::after { left: 100%; }

        .level-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .level-card:nth-child(1) .level-icon { 
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05)); 
            color: #10b981; 
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }
        .level-card:nth-child(2) .level-icon { 
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(0, 210, 255, 0.05)); 
            color: var(--accent); 
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .level-card:nth-child(3) .level-icon { 
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.05)); 
            color: var(--gold); 
            box-shadow: 0 0 20px var(--gold-glow);
        }
        .level-card:nth-child(4) .level-icon { 
            background: linear-gradient(135deg, rgba(255, 51, 102, 0.2), rgba(255, 51, 102, 0.05)); 
            color: var(--wrong); 
            box-shadow: 0 0 20px var(--wrong-glow);
        }
        .level-card:nth-child(5) .level-icon { 
            background: linear-gradient(135deg, rgba(157, 0, 255, 0.2), rgba(157, 0, 255, 0.05)); 
            color: var(--purple); 
            box-shadow: 0 0 20px var(--purple-glow);
        }

        .level-info { flex: 1; position: relative; z-index: 1; }
        .level-info h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
        .level-info p { font-size: 0.9rem; color: var(--muted); font-weight: 300; }

        .level-badge {
            background: linear-gradient(135deg, var(--bg2), var(--card));
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 700;
            white-space: nowrap;
            position: relative;
            z-index: 1;
        }

        /* === شاشة الاختبار === */
        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .quiz-level-name { 
            font-size: 0.95rem; 
            color: var(--accent); 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quiz-score-live { 
            font-size: 1rem; 
            color: var(--gold); 
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-container {
            margin-bottom: 24px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--purple));
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: progressShimmer 2s infinite;
        }

        @keyframes progressShimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* === شريط التنقل بين الأسئلة === */
        .question-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
            padding: 16px;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            max-height: 120px;
            overflow-y: auto;
        }

        .nav-dot {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--bg2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--muted);
        }

        .nav-dot:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.1);
        }

        .nav-dot.current {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .nav-dot.answered {
            background: rgba(0, 210, 255, 0.2);
            border-color: var(--accent);
            color: var(--accent);
        }

        .nav-dot.correct {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            color: #10b981;
        }

        .nav-dot.wrong {
            background: rgba(255, 51, 102, 0.2);
            border-color: var(--wrong);
            color: var(--wrong);
        }

        /* === بطاقة السؤال === */
        .question-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 24px;
            animation: questionSlide 0.5s ease-out;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .question-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--purple), var(--accent));
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        @keyframes questionSlide {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .question-type-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .badge-mcq { 
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.15), rgba(0, 210, 255, 0.05)); 
            color: var(--accent); 
            border: 1px solid rgba(0, 210, 255, 0.3);
        }
        .badge-tf { 
            background: linear-gradient(135deg, rgba(157, 0, 255, 0.15), rgba(157, 0, 255, 0.05)); 
            color: var(--purple); 
            border: 1px solid rgba(157, 0, 255, 0.3);
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 2;
            color: var(--fg);
        }

        /* === خيارات الاختيار من متعدد === */
        .options-list { display: grid; gap: 14px; }

        .option-btn {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 18px 22px;
            text-align: right;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            color: var(--fg);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .option-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, var(--accent-glow));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .option-btn:hover:not(.disabled) {
            border-color: var(--accent);
            transform: translateX(-6px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .option-btn:hover:not(.disabled)::before { opacity: 1; }
        .option-btn:hover:not(.disabled) .opt-letter {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .opt-letter {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--bg2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }

        .option-btn.correct {
            border-color: #10b981 !important;
            background: rgba(16, 185, 129, 0.15) !important;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }

        .option-btn.correct .opt-letter {
            background: #10b981 !important;
            color: white !important;
            border-color: #10b981 !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .option-btn.wrong {
            border-color: var(--wrong) !important;
            background: var(--wrong-glow) !important;
        }

        .option-btn.wrong .opt-letter {
            background: var(--wrong) !important;
            color: white !important;
            border-color: var(--wrong) !important;
        }

        .option-btn.disabled { cursor: default; opacity: 0.5; }
        .option-btn.correct.disabled { opacity: 1; }

        .option-btn.show-correct {
            border-color: #10b981 !important;
            opacity: 1 !important;
            background: rgba(16, 185, 129, 0.1) !important;
        }

        /* === أزرار صح وخطأ === */
        .tf-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .tf-btn {
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--border);
            background: var(--card);
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            backdrop-filter: blur(5px);
        }

        .tf-btn i { font-size: 2rem; }

        .tf-btn:hover:not(.disabled) { transform: translateY(-5px); }

        .tf-btn.tf-true:hover:not(.disabled) {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            box-shadow: 0 15px 30px rgba(16, 185, 129, 0.2);
        }

        .tf-btn.tf-false:hover:not(.disabled) {
            border-color: var(--wrong);
            background: var(--wrong-glow);
            color: var(--wrong);
            box-shadow: 0 15px 30px var(--wrong-glow);
        }

        .tf-btn.correct {
            border-color: #10b981 !important;
            background: rgba(16, 185, 129, 0.2) !important;
            color: #10b981 !important;
        }

        .tf-btn.wrong {
            border-color: var(--wrong) !important;
            background: var(--wrong-glow) !important;
            color: var(--wrong) !important;
        }

        .tf-btn.disabled { cursor: default; }
        .tf-btn.show-correct {
            border-color: #10b981 !important;
            background: rgba(16, 185, 129, 0.15) !important;
            color: #10b981 !important;
            opacity: 1 !important;
        }

        /* === أزرار التحكم === */
        .control-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
        }

        .ctrl-btn {
            padding: 14px 28px;
            border-radius: 14px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn.primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .ctrl-btn.primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 210, 255, 0.35);
        }

        .ctrl-btn.secondary {
            background: var(--card);
            color: var(--fg);
            border: 1px solid var(--border);
        }

        .ctrl-btn.secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .ctrl-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* === شاشة النتائج === */
        .results-screen { text-align: center; padding: 40px 0; }

        .results-visual {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 40px;
        }

        .results-ring {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .results-ring svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 8;
        }

        .ring-progress {
            fill: none;
            stroke: url(#ringGradient);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 628;
            stroke-dashoffset: 628;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 10px var(--accent));
        }

        .results-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .results-pct {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .results-label {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .results-grade {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--fg), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .results-message {
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 36px;
            font-weight: 300;
        }

        .results-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 40px;
        }

        .r-stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px 16px;
            backdrop-filter: blur(10px);
        }

        .r-stat .r-icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .r-stat .r-num {
            font-size: 2rem;
            font-weight: 900;
        }

        .r-stat .r-label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .r-stat.green .r-num { color: #10b981; }
        .r-stat.green .r-icon { color: #10b981; }
        .r-stat.red .r-num { color: var(--wrong); }
        .r-stat.red .r-icon { color: var(--wrong); }
        .r-stat.blue .r-num { color: var(--accent); }
        .r-stat.blue .r-icon { color: var(--accent); }

        .results-actions {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 380px;
            margin: 0 auto;
        }

        .r-btn {
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .r-btn:hover { transform: translateY(-3px); }
        .r-btn.primary {
            background: linear-gradient(135deg, var(--accent), var(--purple));
            color: white;
            box-shadow: 0 10px 30px var(--accent-glow);
        }
        .r-btn.secondary {
            background: var(--card);
            color: var(--fg);
            border: 1px solid var(--border);
        }
        .r-btn.ghost { background: transparent; color: var(--muted); }

        /* === شاشة المراجعة === */
        .review-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .review-header h2 { 
            font-size: 1.4rem; 
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover { 
            border-color: var(--accent); 
            color: var(--accent);
        }

        .review-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 26px;
            margin-bottom: 18px;
            backdrop-filter: blur(10px);
        }

        .review-item.review-correct { 
            border-right: 4px solid #10b981;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.05), transparent);
        }
        .review-item.review-wrong { 
            border-right: 4px solid var(--wrong);
            background: linear-gradient(135deg, var(--wrong-glow), transparent);
        }

        .review-q-head {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 14px;
        }

        .review-q-num {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .review-correct .review-q-num { 
            background: rgba(16, 185, 129, 0.2); 
            color: #10b981; 
        }
        .review-wrong .review-q-num { 
            background: var(--wrong-glow); 
            color: var(--wrong); 
        }

        .review-q-text {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.9;
            flex: 1;
        }

        .review-answers {
            margin-top: 12px;
            font-size: 0.95rem;
            line-height: 2;
        }

        .review-your-ans { color: var(--wrong); }
        .review-your-ans span { font-weight: 700; }
        .review-correct-ans { color: #10b981; }
        .review-correct-ans span { font-weight: 700; }

        /* === Toast === */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            padding: 16px 32px;
            border-radius: 16px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            z-index: 9999;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.correct-toast {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        .toast.wrong-toast {
            background: linear-gradient(135deg, var(--wrong), #cc0044);
            color: white;
        }

        /* === ريسبونسيف === */
        @media (max-width: 640px) {
            .home-header h1 { font-size: 1.8rem; }
            .planet-container { width: 100px; height: 100px; }
            .planet { font-size: 35px; }
            .stats-bar { gap: 16px; padding: 14px 20px; }
            .stat-item .num { font-size: 1.6rem; }
            .level-card { padding: 20px 16px; gap: 14px; }
            .level-icon { width: 50px; height: 50px; font-size: 22px; }
            .level-info h3 { font-size: 1rem; }
            .question-card { padding: 24px 20px; }
            .question-text { font-size: 1.05rem; }
            .option-btn { padding: 14px 16px; font-size: 0.95rem; }
            .tf-btn { padding: 22px 16px; font-size: 1.1rem; }
            .tf-btn i { font-size: 1.5rem; }
            .results-stats { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .r-stat { padding: 16px 12px; }
            .r-stat .r-num { font-size: 1.5rem; }
            .control-btns { flex-direction: column; }
            .question-nav { max-height: 100px; }
            .nav-dot { width: 32px; height: 32px; font-size: 0.75rem; }
        }

        /* === سكرولبار === */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, var(--accent), var(--purple)); 
            border-radius: 4px; 
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<div class="space-bg"></div>
<div class="stars" id="starsContainer"></div>
<div class="shooting-star" style="top: 20%; left: 80%; animation-delay: 0s;"></div>
<div class="shooting-star" style="top: 50%; left: 90%; animation-delay: 2s;"></div>
<div class="nebula nebula-1"></div>
<div class="nebula nebula-2"></div>

<div class="toast" id="toast"></div>

<div class="app-container">

    <!-- ===== الشاشة الرئيسية ===== -->
    <div class="screen active" id="homeScreen">
        <div class="home-header">
            <div class="planet-container">
                <div class="planet-ring"></div>
                <div class="planet">
                    <i class="fa-solid fa-scale-balanced"></i>
                </div>
            </div>

        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="num" id="totalQ">0</div>
                <div class="label">سؤال متاح</div>
            </div>
            <div class="stat-item">
                <div class="num">5</div>
                <div class="label">مستويات</div>
            </div>
            <div class="stat-item">
                <div class="num">2</div>
                <div class="label">نوع أسئلة</div>
            </div>
        </div>

        <div class="levels-grid" id="levelsGrid"></div>
    </div>

    <!-- ===== شاشة الاختبار ===== -->
    <div class="screen" id="quizScreen">
        <div class="quiz-header">
            <div class="quiz-level-name">
                <i class="fa-solid fa-rocket"></i>
                <span id="quizLevelName"></span>
            </div>
            <div class="quiz-score-live">
                <i class="fa-solid fa-star"></i>
                <span id="quizScoreLive">0</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-info">
                <span>التقدم</span>
                <span><span id="currentQ">1</span> / <span id="totalQs">20</span></span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div class="question-nav" id="questionNav"></div>

        <div id="questionArea"></div>

        <div class="control-btns">
            <button class="ctrl-btn secondary" id="prevBtn" onclick="prevQuestion()" disabled>
                <i class="fa-solid fa-arrow-right"></i> السابق
            </button>
            <button class="ctrl-btn primary" id="nextBtn" onclick="nextQuestion()">
                التالي <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>
    </div>

    <!-- ===== شاشة النتائج ===== -->
    <div class="screen" id="resultsScreen">
        <div class="results-screen">
            <div class="results-visual">
                <div class="results-ring">
                    <svg viewBox="0 0 200 200">
                        <defs>
                            <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:var(--accent)"/>
                                <stop offset="100%" style="stop-color:var(--purple)"/>
                            </linearGradient>
                        </defs>
                        <circle class="ring-bg" cx="100" cy="100" r="90"/>
                        <circle class="ring-progress" id="resultRing" cx="100" cy="100" r="90"/>
                    </svg>
                </div>
                <div class="results-center">
                    <div class="results-pct" id="resultPct">0%</div>
                    <div class="results-label">النتيجة</div>
                </div>
            </div>
            <div class="results-grade" id="resultGrade"></div>
            <div class="results-message" id="resultMessage"></div>
            <div class="results-stats">
                <div class="r-stat green">
                    <div class="r-icon"><i class="fa-solid fa-check-circle"></i></div>
                    <div class="r-num" id="rCorrect">0</div>
                    <div class="r-label">صحيح</div>
                </div>
                <div class="r-stat red">
                    <div class="r-icon"><i class="fa-solid fa-times-circle"></i></div>
                    <div class="r-num" id="rWrong">0</div>
                    <div class="r-label">خطأ</div>
                </div>
                <div class="r-stat blue">
                    <div class="r-icon"><i class="fa-solid fa-list-ol"></i></div>
                    <div class="r-num" id="rTotal">0</div>

            </div>
            <div class="results-actions">
                <button class="r-btn primary" onclick="showReview()">
                    <i class="fa-solid fa-list-check"></i> مراجعة الإجابات
                </button>
                <button class="r-btn secondary" onclick="retryQuiz()">
                    <i class="fa-solid fa-redo"></i> إعادة الاختبار

                <button class="r-btn ghost" onclick="goHome()">
                    <i class="fa-solid fa-home"></i> العودة للقائمة
                </button>

    </div>

    <!-- ===== شاشة المراجعة ===== -->
    <div class="screen" id="reviewScreen">
        <div class="review-header">
            <h2><i class="fa-solid fa-list-check" style="color:var(--accent)"></i> مراجعة الإجابات</h2>
            <button class="back-btn" onclick="showScreen('resultsScreen')">
                <i class="fa-solid fa-arrow-right"></i> رجوع

        <div id="reviewList"></div>
    </div>

</div>

<script>
// ========== إنشاء النجوم ==========
function createStars() {
    const container = document.getElementById('starsContainer');
    const starCount = 150;
    for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.setProperty('--opacity', Math.random() * 0.8 + 0.2);
        star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
        star.style.animationDelay = Math.random() * 3 + 's';
        container.appendChild(star);
    }
}
createStars();

// ========== بنك الأسئلة الضخم ==========
const questions = {
    easy: [
        // === الفصل الأول: تعريفات ومفاهيم ===
        { t: "يقصد بحقوق الإنسان:", type: "mcq", o: ["حقوق الأغنياء فقط", "حقوق المواطنين فقط", "الحقوق الأساسية لكل إنسان", "حقوق الموظفين فقط"], a: 2 },
        { t: "بدأت حقوق الإنسان في صورة:", type: "mcq", o: ["معاهدات دولية", "قواعد عرفية", "قوانين جنائية", "دساتير حديثة"], a: 1 },
        { t: "أصبحت حقوق الإنسان جزءًا من:", type: "mcq", o: ["القانون التجاري", "القانون الجنائي", "القانون الدولي لحقوق الإنسان", "القانون الإداري"], a: 2 },
        { t: "كلمة 'ماعت' في الحضارة الفرعونية تعني:", type: "mcq", o: ["الحرب", "العدالة والحق والصدق", "القوة", "الثروة"], a: 1 },
        { t: "من أبرز الشخصيات المرتبطة بحقوق الإنسان في مصر القديمة:", type: "mcq", o: ["رمسيس الثاني", "خوفو", "أخناتون", "مينا"], a: 2 },
        { t: "دعا أخناتون إلى:", type: "mcq", o: ["الحروب والتوسع", "السلام والمساواة", "التمييز بين الناس", "زيادة الضرائب"], a: 1 },
        { t: "اشتهر الفلاح الفصيح بأنه:", type: "mcq", o: ["قائد عسكري", "مدافع عن العدالة والمساواة", "طبيب مشهور", "كاهن معبد"], a: 1 },
        { t: "كان أفلاطون يرى أن:", type: "mcq", o: ["العبيد يتمتعون بكامل حقوق المواطنة", "العبيد يجب أن يطيعوا الأحرار", "جميع الناس متساوون سياسيًا", "يجب إلغاء الرق"], a: 1 },
        { t: "انتشر نظام الرق بشكل واضح عند:", type: "mcq", o: ["المصريين القدماء", "الرومان", "العرب", "الفرس"], a: 1 },
        { t: "صدر الميثاق الأعظم (Magna Carta) عام:", type: "mcq", o: ["1066م", "1215م", "1492م", "1789م"], a: 1 },
        { t: "صدرت عريضة الحقوق عام:", type: "mcq", o: ["1215م", "1776م", "1628م", "1948م"], a: 2 },
        { t: "أصبحت حقوق الإنسان قضية دولية في:", type: "mcq", o: ["العصور القديمة", "العصور الوسطى", "العصر الحديث", "العصر الحجري"], a: 2 },
        { t: "ركزت الثورة الفرنسية على:", type: "mcq", o: ["الرق", "الحرية والمساواة", "الاستعمار", "الإقطاع"], a: 1 },
        { t: "دعت المسيحية إلى:", type: "mcq", o: ["العنف", "التمييز", "المحبة والتسامح", "الحروب"], a: 2 },
        { t: "دافعت المسيحية عن:", type: "mcq", o: ["الأغنياء فقط", "الفقراء والمستضعفين", "الحكام فقط", "التجار فقط"], a: 1 },
        { t: "حقوق الإنسان في الإسلام:", type: "mcq", o: ["مؤقتة", "وضعية فقط", "حقوق ربانية المصدر", "سياسية فقط"], a: 2 },
        { t: "حقوق الإنسان في الإسلام ملزمة:", type: "mcq", o: ["للحاكم فقط", "للمحكوم فقط", "للأجانب فقط", "للحاكم والمحكوم"], a: 3 },
        { t: "تعني المواطنة:", type: "mcq", o: ["امتلاك الأرض", "العلاقة بين الفرد والدولة", "العمل الحكومي", "الانتماء الديني"], a: 1 },
        { t: "من أهم حقوق الإنسان:", type: "mcq", o: ["الحق في الحياة", "الحق في التمييز", "الحق في الاستعباد", "الحق في الظلم"], a: 0 },
        { t: "ترتبط ظاهرة الفساد غالبًا بـ:", type: "mcq", o: ["زيادة احترام حقوق الإنسان", "زيادة انتهاك حقوق الإنسان", "زيادة التعليم فقط", "زيادة التجارة فقط"], a: 1 },
        // === تعريفات أساسية ===
        { t: "ما المقصود بحقوق الإنسان اصطلاحًا؟", type: "mcq", o: ["العقوبات القانونية", "المصالح والحريات التي يتمتع بها الفرد", "الواجبات فقط", "القوانين الجنائية"], a: 1 },
        { t: "تعد حقوق الإنسان أساسًا لـ:", type: "mcq", o: ["التجارة", "الحرية والعدالة والسلام", "الصناعة", "الضرائب"], a: 1 },
        { t: "القانون الداخلي لحقوق الإنسان ينظم العلاقة بين:", type: "mcq", o: ["الدول والمنظمات الدولية", "الدولة ورعاياها", "الشركات والعملاء", "البرلمان والمحاكم"], a: 1 },
        { t: "أي مما يلي يعد من حقوق الإنسان؟", type: "mcq", o: ["حق الحياة", "رخصة القيادة", "جواز السفر", "البطاقة الشخصية"], a: 0 },

        { t: "من خصائص حقوق الإنسان أنها:", type: "mcq", o: ["تباع وتشترى", "تورث", "غير قابلة للتنازل عنها", "تمنح للأغنياء فقط"], a: 2 },
        { t: "حقوق الإنسان عالمية بمعنى أنها:", type: "mcq", o: ["تخص دولة معينة", "تشمل جميع البشر دون تمييز", "تخص الرجال فقط", "تخص المواطنين فقط"], a: 1 },
        { t: "أي من الآتي ليس من خصائص حقوق الإنسان؟", type: "mcq", o: ["عالمية", "مترابطة", "قابلة للبيع", "غير قابلة للتجزئة"], a: 2 },
        { t: "من المصادر التاريخية لحقوق الإنسان:", type: "mcq", o: ["الدستور", "القانون التجاري", "الأديان السماوية والفلسفات القديمة", "اللوائح التنفيذية"], a: 2 },
        { t: "من الفلاسفة الذين أسهموا في فكرة حقوق الإنسان:", type: "mcq", o: ["أرسطو", "نيوتن", "داروين", "إديسون"], a: 0 },
        { t: "الماجنا كارتا صدرت في:", type: "mcq", o: ["فرنسا", "إنجلترا", "أمريكا", "إيطاليا"], a: 1 },
        { t: "سنة صدور الماجنا كارتا هي:", type: "mcq", o: ["1215م", "1628م", "1776م", "1789م"], a: 0 },
        { t: "إعلان الاستقلال الأمريكي صدر عام:", type: "mcq", o: ["1215م", "1628م", "1776م", "1789م"], a: 2 },
        { t: "إعلان حقوق الإنسان والمواطن الفرنسي صدر عام:", type: "mcq", o: ["1776م", "1789م", "1815م", "1948م"], a: 1 },

// ========== بيانات المستويات ==========
const levels = [
    { key: "easy", name: "المستوى الأساسي", desc: "مبادئ وتعريفات وتاريخ حقوق الإنسان", icon: "fa-rocket", color: "#10b981" },
    { key: "medium", name: "المستوى المتوسط", desc: "تصنيفات الحقوق والفساد", icon: "fa-satellite", color: "#00d2ff" },
    { key: "hard", name: "المستوى الصعب", desc: "أنواع الفساد وأسبابه وآثاره", icon: "fa-meteor", color: "#ffd700" },
    { key: "expert", name: "المستوى الخبير", desc: "أجهزة مكافحة الفساد والقوانين", icon: "fa-user-astronaut", color: "#ff3366" },
    { key: "all", name: "اختبار شامل", desc: "مزيج من جميع المستويات", icon: "fa-star", color: "#9d00ff" },
];

// ========== حالة التطبيق ==========
let currentLevel = null;
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let userAnswers = [];

// ========== تهيئة ==========
function init() {
    let total = 0;
    for (let key in questions) total += questions[key].length;
    document.getElementById("totalQ").textContent = total;

    const grid = document.getElementById("levelsGrid");
    grid.innerHTML = "";
    levels.forEach(lv => {
        let count = lv.key === "all" ? 40 : questions[lv.key].length;
        const card = document.createElement("div");
        card.className = "level-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", `ابدأ ${lv.name}`);
        card.innerHTML = `
            <div class="level-icon"><i class="fa-solid ${lv.icon}"></i></div>
            <div class="level-info">
                <h3>${lv.name}</h3>
                <p>${lv.desc}</p>
            </div>
            <div class="level-badge">${count} سؤال</div>
        `;
        card.addEventListener("click", () => startQuiz(lv.key));
        card.addEventListener("keydown", (e) => { if (e.key === "Enter") startQuiz(lv.key); });
        grid.appendChild(card);
    });
}

// ========== بدء الاختبار ==========
function startQuiz(levelKey) {
    currentLevel = levelKey;
    currentIndex = 0;
    score = 0;
    userAnswers = [];

    if (levelKey === "all") {
        let allQ = [];
        for (let key in questions) allQ = allQ.concat(questions[key]);
        shuffleArray(allQ);
        currentQuestions = allQ.slice(0, 40);
    } else {
        currentQuestions = [...questions[levelKey]];
        shuffleArray(currentQuestions);
    }

    const lv = levels.find(l => l.key === levelKey);
    document.getElementById("quizLevelName").textContent = lv.name;
    document.getElementById("totalQs").textContent = currentQuestions.length;
    updateScoreDisplay();
    buildNavDots();
    showScreen("quizScreen");
    renderQuestion();
}

// ========== بناء نقاط التنقل ==========
function buildNavDots() {
    const nav = document.getElementById("questionNav");
    nav.innerHTML = "";
    for (let i = 0; i < currentQuestions.length; i++) {
        const dot = document.createElement("div");
        dot.className = "nav-dot";
        dot.textContent = i + 1;
        dot.addEventListener("click", () => goToQuestion(i));
        nav.appendChild(dot);
    }
    updateNavDots();
}

// ========== تحديث نقاط التنقل ==========
function updateNavDots() {
    const dots = document.querySelectorAll(".nav-dot");
    dots.forEach((dot, i) => {
        dot.classList.remove("current", "answered", "correct", "wrong");
        if (i === currentIndex) dot.classList.add("current");
        if (userAnswers[i] !== undefined) {
            if (userAnswers[i].correct) dot.classList.add("correct");
            else dot.classList.add("wrong");
        }
    });
}

// ========== الانتقال لسؤال معين ==========
function goToQuestion(index) {
    if (index >= 0 && index < currentQuestions.length) {
        currentIndex = index;
        renderQuestion();
        updateNavDots();
        updateControlButtons();
    }
}

// ========== عرض السؤال ==========
function renderQuestion() {
    const q = currentQuestions[currentIndex];
    const area = document.getElementById("questionArea");

    document.getElementById("currentQ").textContent = currentIndex + 1;
    document.getElementById("progressFill").style.width = ((currentIndex + 1) / currentQuestions.length * 100) + "%";

    let html = `<div class="question-card">`;
    html += `<span class="question-type-badge ${q.type === 'mcq' ? 'badge-mcq' : 'badge-tf'}">`;
    html += `<i class="fa-solid ${q.type === 'mcq' ? 'fa-list' : 'fa-toggle-on'}"></i>`;
    html += q.type === 'mcq' ? 'اختيار من متعدد' : 'صح أو خطأ';
    html += `</span>`;
    html += `<div class="question-text">${q.t}</div>`;

    const isAnswered = userAnswers[currentIndex] !== undefined;
    const userAnswer = isAnswered ? userAnswers[currentIndex] : null;

    if (q.type === "mcq") {
        const letters = ["أ", "ب", "ج", "د"];
        html += `<div class="options-list">`;
        q.o.forEach((opt, i) => {
            let classes = "option-btn";
            if (isAnswered) {
                classes += " disabled";
                if (i === q.a) classes += " correct";
                else if (i === userAnswer.userAnswer && !userAnswer.correct) classes += " wrong";
            }
            html += `<button class="${classes}" data-index="${i}" ${isAnswered ? '' : `onclick="selectAnswer(${i})"`} aria-label="الخيار ${letters[i]}">
                <span class="opt-letter">${letters[i]}</span>
                <span>${opt}</span>
            </button>`;
        });
        html += `</div>`;
    } else {
        html += `<div class="tf-options">`;
        const opts = [
            { val: true, label: "صح", icon: "fa-check", class: "tf-true" },
            { val: false, label: "خطأ", icon: "fa-xmark", class: "tf-false" }
        ];
        opts.forEach(opt => {
            let classes = `tf-btn ${opt.class}`;
            if (isAnswered) {
                classes += " disabled";
                if (opt.val === q.a) classes += " correct";
                else if (opt.val === userAnswer.userAnswer && !userAnswer.correct) classes += " wrong";
            }
            html += `<button class="${classes}" ${isAnswered ? '' : `onclick="selectAnswer(${opt.val})"`}>
                <i class="fa-solid ${opt.icon}"></i>
                ${opt.label}
            </button>`;
        });
        html += `</div>`;
    }

    html += `</div>`;
    area.innerHTML = html;
    updateControlButtons();
    updateNavDots();
}

// ========== تحديث أزرار التحكم ==========
function updateControlButtons() {
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const nextBtnText = document.getElementById("nextBtn").innerHTML;

    prevBtn.disabled = currentIndex === 0;

    if (currentIndex === currentQuestions.length - 1) {
        nextBtn.innerHTML = `<i class="fa-solid fa-flag-checkered"></i> إنهاء الاختبار`;
    } else {
        nextBtn.innerHTML = `التالي <i class="fa-solid fa-arrow-left"></i>`;
    }
}

// ========== اختيار إجابة ==========
function selectAnswer(val) {
    if (userAnswers[currentIndex] !== undefined) return;

    const q = currentQuestions[currentIndex];
    let isCorrect = false;

    if (q.type === "mcq") {
        isCorrect = val === q.a;
    } else {
        isCorrect = val === q.a;
    }

    userAnswers[currentIndex] = { question: q, userAnswer: val, correct: isCorrect };

    if (isCorrect) {
        score++;
        showToast("إجابة صحيحة", true);
    } else {
        showToast("إجابة خاطئة", false);
    }

    updateScoreDisplay();
    renderQuestion();
}

// ========== التنقل بين الأسئلة ==========
function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function nextQuestion() {
    if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        showResults();
    }
}

// ========== عرض النتائج ==========
function showResults() {
    showScreen("resultsScreen");

    const total = currentQuestions.length;
    const pct = Math.round((score / total) * 100);

    document.getElementById("rCorrect").textContent = score;
    document.getElementById("rWrong").textContent = total - score;
    document.getElementById("rTotal").textContent = total;
    document.getElementById("resultPct").textContent = pct + "%";

    const ring = document.getElementById("resultRing");
    const circumference = 2 * Math.PI * 90;
    const offset = circumference - (pct / 100) * circumference;

    setTimeout(() => {
        ring.style.strokeDashoffset = offset;
    }, 100);

    let grade = "", message = "";
    if (pct >= 90) { grade = "متميز"; message = "أداء استثنائي! أنت خبير في حقوق الإنسان"; }
    else if (pct >= 75) { grade = "ممتاز"; message = "أداء رائع! معرفة قوية بالمادة"; }
    else if (pct >= 60) { grade = "جيد جدًا"; message = "أداء جيد، استمر في المراجعة"; }
    else if (pct >= 40) { grade = "جيد"; message = "تحتاج لمزيد من الدراسة"; }
    else { grade = "يحتاج تحسين"; message = "راجع المادة جيدًا وحاول مرة أخرى"; }

    document.getElementById("resultGrade").textContent = grade;
    document.getElementById("resultMessage").textContent = message;
}

// ========== المراجعة ==========
function showReview() {
    showScreen("reviewScreen");
    const list = document.getElementById("reviewList");
    list.innerHTML = "";

    userAnswers.forEach((ua, i) => {
        if (!ua) return;
        const q = ua.question;
        const item = document.createElement("div");
        item.className = `review-item ${ua.correct ? "review-correct" : "review-wrong"}`;

        let yourAnsText = "";
        let correctAnsText = "";

        if (q.type === "mcq") {
            const letters = ["أ", "ب", "ج", "د"];
            yourAnsText = q.o[ua.userAnswer] ? `${letters[ua.userAnswer]}. ${q.o[ua.userAnswer]}` : "لم يتم الاختيار";
            correctAnsText = `${letters[q.a]}. ${q.o[q.a]}`;
        } else {
            yourAnsText = ua.userAnswer === true ? "صح" : "خطأ";
            correctAnsText = q.a === true ? "صح" : "خطأ";
        }

        item.innerHTML = `
            <div class="review-q-head">
                <div class="review-q-num">${i + 1}</div>
                <div class="review-q-text">${q.t}</div>
            </div>
            <div class="review-answers">
                ${ua.correct ? '' : `<div class="review-your-ans"><i class="fa-solid fa-times"></i> إجابتك: <span>${yourAnsText}</span></div>`}
                <div class="review-correct-ans"><i class="fa-solid fa-check"></i> الإجابة الصحيحة: <span>${correctAnsText}</span></div>
            </div>
        `;
        list.appendChild(item);
    });
}

// ========== إعادة الاختبار ==========
function retryQuiz() {
    document.getElementById("resultRing").style.strokeDashoffset = 628;
    startQuiz(currentLevel);
}

// ========== العودة للقائمة ==========
function goHome() {
    document.getElementById("resultRing").style.strokeDashoffset = 628;
    showScreen("homeScreen");
}

// ========== أدوات مساعدة ==========
function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function updateScoreDisplay() {
    document.getElementById("quizScoreLive").textContent = score;
}

function showToast(msg, isCorrect) {
    const toast = document.getElementById("toast");
    toast.innerHTML = `<i class="fa-solid ${isCorrect ? 'fa-check-circle' : 'fa-times-circle'}"></i> ${msg}`;
    toast.className = `toast ${isCorrect ? 'correct-toast' : 'wrong-toast'} show`;
    setTimeout(() => toast.classList.remove("show"), 2000);
}

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// ========== لوحة المفاتيح ==========
document.addEventListener("keydown", (e) => {
    if (!document.getElementById("quizScreen").classList.contains("active")) return;

    const q = currentQuestions[currentIndex];
    if (userAnswers[currentIndex] !== undefined) {
        if (e.key === "ArrowRight" && currentIndex > 0) prevQuestion();
        else if (e.key === "ArrowLeft" && currentIndex < currentQuestions.length - 1) nextQuestion();
        else if (e.key === "Enter") nextQuestion();
        return;
    }

    if (q.type === "mcq") {
        if (e.key === "1" || e.key === "a") selectAnswer(0);
        else if (e.key === "2" || e.key === "b") selectAnswer(1);
        else if (e.key === "3" || e.key === "c") selectAnswer(2);
        else if (e.key === "4" || e.key === "d") selectAnswer(3);
    } else {
        if (e.key === "1" || e.key === "t") selectAnswer(true);
        else if (e.key === "2" || e.key === "f") selectAnswer(false);
    }
});

// ========== بدء التطبيق ==========
init();
</script>
