<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كويز حقوق الإنسان ومكافحة الفساد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #060d18;
            --bg2: #0c1629;
            --card: #111d35;
            --card-hover: #162545;
            --border: #1e3055;
            --fg: #e8edf5;
            --muted: #7a8ba8;
            --accent: #10b981;
            --accent2: #059669;
            --accent-glow: rgba(16, 185, 129, 0.15);
            --wrong: #ef4444;
            --wrong-glow: rgba(239, 68, 68, 0.15);
            --gold: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* === خلفية متحركة === */
        .bg-effects {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            animation: blobFloat 20s ease-in-out infinite alternate;
        }
        .bg-blob:nth-child(1) {
            width: 500px; height: 500px;
            background: var(--accent);
            top: -10%; right: -10%;
            animation-delay: 0s;
        }
        .bg-blob:nth-child(2) {
            width: 400px; height: 400px;
            background: #0ea5e9;
            bottom: -15%; left: -10%;
            animation-delay: -7s;
        }
        .bg-blob:nth-child(3) {
            width: 300px; height: 300px;
            background: var(--gold);
            top: 40%; left: 50%;
            opacity: 0.1;
            animation-delay: -14s;
        }
        @keyframes blobFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
            100% { transform: translate(10px, -20px) scale(1.05); }
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(16,185,129,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16,185,129,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* === الحاوية الرئيسية === */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        /* === الشاشة الرئيسية === */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeSlideIn 0.5s ease; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .home-header {
            text-align: center;
            padding: 60px 0 40px;
        }
        .home-header .icon-wrap {
            width: 90px; height: 90px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            box-shadow: 0 8px 32px var(--accent-glow);
            animation: iconPulse 3s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 32px var(--accent-glow); }
            50% { transform: scale(1.05); box-shadow: 0 12px 48px rgba(16,185,129,0.25); }
        }
        .home-header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--fg), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        .home-header p {
            color: var(--muted);
            font-size: 1.05rem;
            font-weight: 300;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin: 30px 0 40px;
            padding: 16px 24px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .num {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent);
        }
        .stat-item .label {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 2px;
        }

        /* === بطاقات المستويات === */
        .levels-grid {
            display: grid;
            gap: 16px;
        }
        .level-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }
        .level-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, var(--accent-glow));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .level-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 32px var(--accent-glow);
        }
        .level-card:hover::before { opacity: 1; }

        .level-icon {
            width: 56px; height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .level-card:nth-child(1) .level-icon { background: rgba(16,185,129,0.15); color: #10b981; }
        .level-card:nth-child(2) .level-icon { background: rgba(14,165,233,0.15); color: #0ea5e9; }
        .level-card:nth-child(3) .level-icon { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .level-card:nth-child(4) .level-icon { background: rgba(239,68,68,0.15); color: #ef4444; }
        .level-card:nth-child(5) .level-icon { background: rgba(168,85,247,0.15); color: #a855f7; }

        .level-info {
            flex: 1;
            position: relative;
            z-index: 1;
        }
        .level-info h3 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .level-info p {
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 300;
        }
        .level-badge {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 14px;
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 700;
            white-space: nowrap;
            position: relative;
            z-index: 1;
        }

        /* === شاشة الاختبار === */
        .quiz-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .quiz-level-name {
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: 600;
        }
        .quiz-score-live {
            font-size: 0.9rem;
            color: var(--gold);
            font-weight: 700;
        }

        .progress-wrap {
            background: var(--bg2);
            border-radius: 10px;
            height: 8px;
            margin-bottom: 28px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 10px;
            transition: width 0.5s ease;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .question-counter {
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 20px;
        }
        .question-counter span { color: var(--fg); font-weight: 700; }

        .question-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 28px;
            margin-bottom: 24px;
            animation: questionIn 0.4s ease;
        }
        @keyframes questionIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .question-type-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .badge-mcq { background: rgba(14,165,233,0.15); color: #0ea5e9; }
        .badge-tf { background: rgba(245,158,11,0.15); color: #f59e0b; }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.9;
            color: var(--fg);
        }

        .options-list {
            display: grid;
            gap: 12px;
        }
        .option-btn {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 16px 20px;
            text-align: right;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Cairo', sans-serif;
            font-size: 0.98rem;
            color: var(--fg);
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            overflow: hidden;
        }
        .option-btn:hover:not(.disabled) {
            border-color: var(--accent);
            background: var(--card-hover);
            transform: translateX(-4px);
        }
        .option-btn .opt-letter {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: var(--bg2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
            transition: all 0.25s;
        }
        .option-btn:hover:not(.disabled) .opt-letter {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .option-btn.correct {
            border-color: var(--accent) !important;
            background: var(--accent-glow) !important;
        }
        .option-btn.correct .opt-letter {
            background: var(--accent) !important;
            color: white !important;
            border-color: var(--accent) !important;
        }
        .option-btn.wrong {
            border-color: var(--wrong) !important;
            background: var(--wrong-glow) !important;
        }
        .option-btn.wrong .opt-letter {
            background: var(--wrong) !important;
            color: white !important;
            border-color: var(--wrong) !important;
        }
        .option-btn.disabled { cursor: default; opacity: 0.6; }
        .option-btn.correct.disabled { opacity: 1; }
        .option-btn.show-correct {
            border-color: var(--accent) !important;
            opacity: 1 !important;
        }
        .option-btn.show-correct .opt-letter {
            background: var(--accent) !important;
            color: white !important;
            border-color: var(--accent) !important;
        }

        /* أزرار صح وغلط */
        .tf-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .tf-btn {
            padding: 24px;
            border-radius: 16px;
            border: 2px solid var(--border);
            background: var(--card);
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .tf-btn:hover:not(.disabled) {
            transform: translateY(-3px);
        }
        .tf-btn.tf-true:hover:not(.disabled) {
            border-color: var(--accent);
            background: var(--accent-glow);
            color: var(--accent);
        }
        .tf-btn.tf-false:hover:not(.disabled) {
            border-color: var(--wrong);
            background: var(--wrong-glow);
            color: var(--wrong);
        }
        .tf-btn.correct {
            border-color: var(--accent) !important;
            background: var(--accent-glow) !important;
            color: var(--accent) !important;
        }
        .tf-btn.wrong {
            border-color: var(--wrong) !important;
            background: var(--wrong-glow) !important;
            color: var(--wrong) !important;
        }
        .tf-btn.disabled { cursor: default; }
        .tf-btn.show-correct {
            border-color: var(--accent) !important;
            background: var(--accent-glow) !important;
            color: var(--accent) !important;
            opacity: 1 !important;
        }

        .next-btn-wrap {
            text-align: center;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .next-btn-wrap.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }
        .next-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            border: none;
            padding: 14px 48px;
            border-radius: 14px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(16,185,129,0.3);
        }

        .explanation-box {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.7;
            animation: fadeSlideIn 0.3s ease;
        }
        .explanation-box i { color: var(--gold); margin-left: 6px; }

        /* === شاشة النتائج === */
        .results-screen {
            text-align: center;
            padding: 40px 0;
        }
        .results-circle {
            width: 180px; height: 180px;
            margin: 0 auto 30px;
            position: relative;
        }
        .results-circle svg {
            width: 100%; height: 100%;
            transform: rotate(-90deg);
        }
        .results-circle .bg-ring {
            fill: none;
            stroke: var(--border);
            stroke-width: 10;
        }
        .results-circle .fg-ring {
            fill: none;
            stroke: var(--accent);
            stroke-width: 10;
            stroke-linecap: round;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            transition: stroke-dashoffset 1.5s ease;
        }
        .results-circle .fg-ring.low { stroke: var(--wrong); }
        .results-circle .fg-ring.mid { stroke: var(--gold); }
        .results-circle .center-text {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .results-circle .center-text .pct {
            font-size: 2.5rem;
            font-weight: 900;
        }
        .results-circle .center-text .pct-label {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .results-grade {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 8px;
        }
        .results-message {
            color: var(--muted);
            font-size: 1rem;
            margin-bottom: 32px;
            font-weight: 300;
        }

        .results-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 36px;
        }
        .r-stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 12px;
        }
        .r-stat .r-num {
            font-size: 1.6rem;
            font-weight: 900;
        }
        .r-stat .r-label {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 2px;
        }
        .r-stat.green .r-num { color: var(--accent); }
        .r-stat.red .r-num { color: var(--wrong); }
        .r-stat.blue .r-num { color: #0ea5e9; }

        .results-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 360px;
            margin: 0 auto;
        }
        .r-btn {
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
        }
        .r-btn:hover { transform: translateY(-2px); }
        .r-btn.primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .r-btn.secondary {
            background: var(--card);
            color: var(--fg);
            border: 1px solid var(--border);
        }
        .r-btn.ghost {
            background: transparent;
            color: var(--muted);
        }

        /* === شاشة المراجعة === */
        .review-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .review-header h2 { font-size: 1.3rem; font-weight: 700; }
        .back-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 10px 20px;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
        }
        .back-btn:hover { border-color: var(--accent); }

        .review-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .review-item.review-correct { border-right: 4px solid var(--accent); }
        .review-item.review-wrong { border-right: 4px solid var(--wrong); }

        .review-q-head {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .review-q-num {
            width: 30px; height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .review-correct .review-q-num { background: var(--accent-glow); color: var(--accent); }
        .review-wrong .review-q-num { background: var(--wrong-glow); color: var(--wrong); }

        .review-q-text {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.8;
            flex: 1;
        }
        .review-answers {
            margin-top: 10px;
            font-size: 0.9rem;
            line-height: 1.8;
        }
        .review-your-ans { color: var(--wrong); }
        .review-your-ans span { font-weight: 700; }
        .review-correct-ans { color: var(--accent); }
        .review-correct-ans span { font-weight: 700; }

        /* === توست === */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 14px 28px;
            border-radius: 14px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            z-index: 999;
            transition: transform 0.4s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.correct-toast {
            background: var(--accent);
            color: white;
        }
        .toast.wrong-toast {
            background: var(--wrong);
            color: white;
        }

        /* === ريسبونسيف === */
        @media (max-width: 640px) {
            .home-header h1 { font-size: 1.6rem; }
            .stats-bar { gap: 20px; padding: 12px 16px; }
            .stat-item .num { font-size: 1.3rem; }
            .level-card { padding: 18px 16px; gap: 14px; }
            .level-info h3 { font-size: 1rem; }
            .question-card { padding: 24px 20px; }
            .question-text { font-size: 1.05rem; }
            .option-btn { padding: 14px 16px; font-size: 0.9rem; }
            .tf-btn { padding: 20px 16px; font-size: 1.05rem; }
            .results-stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .r-stat { padding: 14px 8px; }
            .r-stat .r-num { font-size: 1.3rem; }
        }

        /* === سكرولبار === */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<div class="bg-effects">
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
</div>
<div class="bg-grid"></div>

<!-- توست -->
<div class="toast" id="toast"></div>

<div class="app-container">

    <!-- ===== الشاشة الرئيسية ===== -->
    <div class="screen active" id="homeScreen">
        <div class="home-header">
            <div class="icon-wrap">
                <i class="fa-solid fa-scale-balanced"></i>
            </div>
            <h1>حقوق الإنسان ومكافحة الفساد</h1>
            <p>اختبر معلوماتك في حقوق الإنسان بأسئلة متنوعة وبدون ضغط وقت</p>
        </div>

        <div class="stats-bar">
            <div class="stat-item">

// ========== بيانات المستويات ==========
const levels = [
    { key: "easy", name: "المستوى الأساسي", desc: "مبادئ عامة ونظريات أساسية", icon: "fa-book-open", color: "#10b981" },
    { key: "medium", name: "المستوى المتوسط", desc: "الحقوق الفردية والمصادر التفصيلية", icon: "fa-graduation-cap", color: "#0ea5e9" },
    { key: "hard", name: "المستوى الصعب", desc: "أسئلة تحليلية ومصطلحات دقيقة", icon: "fa-fire", color: "#f59e0b" },
    { key: "expert", name: "المستوى الخبير", desc: "حالات معقدة وأسئلة محيرة", icon: "fa-skull-crossbones", color: "#ef4444" },
    { key: "all", name: "اختبار شامل", desc: "أسئلة عشوائية من جميع المستويات", icon: "fa-trophy", color: "#a855f7" },
];

// ========== حالة التطبيق ==========
let currentLevel = null;
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let userAnswers = [];
let answered = false;

// ========== تهيئة ==========
function init() {
    // حساب إجمالي الأسئلة
    let total = 0;
    for (let key in questions) total += questions[key].length;
    document.getElementById("totalQ").textContent = total;

    // بناء بطاقات المستويات
    const grid = document.getElementById("levelsGrid");
    grid.innerHTML = "";
    levels.forEach(lv => {
        let count = lv.key === "all" ? 40 : questions[lv.key].length;
        const card = document.createElement("div");
        card.className = "level-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", `ابدأ ${lv.name}`);
        card.innerHTML = `
            <div class="level-icon"><i class="fa-solid ${lv.icon}"></i></div>
            <div class="level-info">
                <h3>${lv.name}</h3>
                <p>${lv.desc}</p>
            </div>
            <div class="level-badge">${count} سؤال</div>
        `;
        card.addEventListener("click", () => startQuiz(lv.key));
        card.addEventListener("keydown", (e) => { if (e.key === "Enter") startQuiz(lv.key); });
        grid.appendChild(card);
    });
}

// ========== بدء الاختبار ==========
function startQuiz(levelKey) {
    currentLevel = levelKey;
    currentIndex = 0;
    score = 0;
    userAnswers = [];
    answered = false;

    if (levelKey === "all") {
        // أخذ 40 سؤال عشوائي من كل المستويات
        let allQ = [];
        for (let key in questions) allQ = allQ.concat(questions[key]);
        shuffleArray(allQ);
        currentQuestions = allQ.slice(0, 40);
    } else {
        currentQuestions = [...questions[levelKey]];
        shuffleArray(currentQuestions);
    }

    const lv = levels.find(l => l.key === levelKey);
    document.getElementById("quizLevelName").textContent = lv.name;
    document.getElementById("totalQs").textContent = currentQuestions.length;
    updateScoreDisplay();
    showScreen("quizScreen");
    renderQuestion();
}

// ========== عرض السؤال ==========
function renderQuestion() {
    answered = false;
    const q = currentQuestions[currentIndex];
    const area = document.getElementById("questionArea");

    document.getElementById("currentQ").textContent = currentIndex + 1;
    document.getElementById("progressFill").style.width = ((currentIndex) / currentQuestions.length * 100) + "%";
    document.getElementById("nextBtnWrap").classList.remove("show");

    let html = `<div class="question-card">`;
    html += `<span class="question-type-badge ${q.type === 'mcq' ? 'badge-mcq' : 'badge-tf'}">${q.type === 'mcq' ? 'اختيار من متعدد' : 'صح أو غلط'}</span>`;
    html += `<div class="question-text">${q.t}</div>`;

    if (q.type === "mcq") {
        const letters = ["أ", "ب", "ج", "د"];
        html += `<div class="options-list">`;
        q.o.forEach((opt, i) => {
            html += `<button class="option-btn" data-index="${i}" onclick="selectAnswer(${i})" aria-label="الخيار ${letters[i]}">
                <span class="opt-letter">${letters[i]}</span>
                <span>${opt}</span>
            </button>`;
        });
        html += `</div>`;
    } else {
        html += `<div class="tf-options">
            <button class="tf-btn tf-true" onclick="selectAnswer(true)" aria-label="صح">
                <i class="fa-solid fa-check"></i> صح
            </button>
            <button class="tf-btn tf-false" onclick="selectAnswer(false)" aria-label="خطأ">
                <i class="fa-solid fa-xmark"></i> خطأ
            </button>
        </div>`;
    }

    html += `</div>`;
    area.innerHTML = html;
}

// ========== اختيار إجابة ==========
function selectAnswer(val) {
    if (answered) return;
    answered = true;

    const q = currentQuestions[currentIndex];
    let isCorrect = false;

    if (q.type === "mcq") {
        isCorrect = val === q.a;
        const btns = document.querySelectorAll(".option-btn");
        btns.forEach((btn, i) => {
            btn.classList.add("disabled");
            if (i === q.a) btn.classList.add("correct");
            if (i === val && !isCorrect) btn.classList.add("wrong");
        });
    } else {
        isCorrect = val === q.a;
        const btns = document.querySelectorAll(".tf-btn");
        btns.forEach(btn => {
            btn.classList.add("disabled");
            const isTrueBtn = btn.classList.contains("tf-true");
            if (isTrueBtn === q.a) btn.classList.add("correct");
            if ((isTrueBtn === val) && !isCorrect) btn.classList.add("wrong");
        });
    }

    if (isCorrect) {
        score++;
        showToast("إجابة صحيحة", true);
    } else {
        showToast("إجابة خاطئة", false);
    }

    userAnswers.push({ question: q, userAnswer: val, correct: isCorrect });
    updateScoreDisplay();

    // عرض زر التالي
    setTimeout(() => {
        const wrap = document.getElementById("nextBtnWrap");
        const btnText = document.getElementById("nextBtnText");
        btnText.textContent = currentIndex === currentQuestions.length - 1 ? "عرض النتائج" : "السؤال التالي";
        wrap.classList.add("show");
    }, 600);
}

// ========== السؤال التالي ==========
function nextQuestion() {
    currentIndex++;
    if (currentIndex >= currentQuestions.length) {
        showResults();
    } else {
        renderQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
    }
}

// ========== عرض النتائج ==========
function showResults() {
    document.getElementById("progressFill").style.width = "100%";
    showScreen("resultsScreen");

    const total = currentQuestions.length;
    const pct = Math.round((score / total) * 100);

    document.getElementById("rCorrect").textContent = score;
    document.getElementById("rWrong").textContent = total - score;
    document.getElementById("rTotal").textContent = total;
    document.getElementById("resultPct").textContent = pct + "%";

    // حلقة النتيجة
    const ring = document.getElementById("resultRing");
    const circumference = 2 * Math.PI * 70; // ~440
    const offset = circumference - (pct / 100) * circumference;
    ring.classList.remove("low", "mid");
    if (pct < 50) ring.classList.add("low");
    else if (pct < 75) ring.classList.add("mid");

    setTimeout(() => {
        ring.style.strokeDashoffset = offset;
    }, 100);

    // التقييم
    let grade = "", message = "";
    if (pct >= 90) { grade = "ممتاز"; message = "أداء رائع! أنت متمكن من المادة بجدارة"; }
    else if (pct >= 75) { grade = "جيد جدًا"; message = "مستوى جيد جدًا، مع مزيد من المراجعة ستصل للأفضل"; }
    else if (pct >= 60) { grade = "جيد"; message = "أداء مقبول، تحتاج لمراجعة بعض النقاط"; }
    else if (pct >= 40) { grade = "مقبول"; message = "تحتاج لمراجعة جادة للمادة"; }
    else { grade = "ضعيف"; message = "لا تقلق، عد للمادة وراجع جيدًا ثم حاول مرة أخرى"; }

    document.getElementById("resultGrade").textContent = grade;
    document.getElementById("resultMessage").textContent = message;
}

// ========== المراجعة ==========
function showReview() {
    showScreen("reviewScreen");
    const list = document.getElementById("reviewList");
    list.innerHTML = "";

    userAnswers.forEach((ua, i) => {
        const q = ua.question;
        const item = document.createElement("div");
        item.className = `review-item ${ua.correct ? "review-correct" : "review-wrong"}`;

        let yourAnsText = "";
        let correctAnsText = "";

        if (q.type === "mcq") {
            const letters = ["أ", "ب", "ج", "د"];
            yourAnsText = q.o[ua.userAnswer] ? `${letters[ua.userAnswer]}. ${q.o[ua.userAnswer]}` : "لم يتم الاختيار";
            correctAnsText = `${letters[q.a]}. ${q.o[q.a]}`;
        } else {
            yourAnsText = ua.userAnswer === true ? "صح" : "خطأ";
            correctAnsText = q.a === true ? "صح" : "خطأ";
        }

        item.innerHTML = `
            <div class="review-q-head">
                <div class="review-q-num">${i + 1}</div>
                <div class="review-q-text">${q.t}</div>
            </div>
            <div class="review-answers">
                ${ua.correct ? '' : `<div class="review-your-ans"><i class="fa-solid fa-xmark"></i> إجابتك: <span>${yourAnsText}</span></div>`}
                <div class="review-correct-ans"><i class="fa-solid fa-check"></i> الإجابة الصحيحة: <span>${correctAnsText}</span></div>
            </div>
        `;
        list.appendChild(item);
    });
}

// ========== إعادة الاختبار ==========
function retryQuiz() {
    // إعادة تعيين حلقة النتيجة
    document.getElementById("resultRing").style.strokeDashoffset = 440;
    startQuiz(currentLevel);
}

// ========== العودة للقائمة ==========
function goHome() {
    document.getElementById("resultRing").style.strokeDashoffset = 440;
    showScreen("homeScreen");
}

// ========== أدوات مساعدة ==========
function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function updateScoreDisplay() {
    document.getElementById("quizScoreLive").innerHTML = `<i class="fa-solid fa-star"></i> ${score}`;
}

function showToast(msg, isCorrect) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.className = `toast ${isCorrect ? 'correct-toast' : 'wrong-toast'} show`;
    setTimeout(() => toast.classList.remove("show"), 1500);
}

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// ========== لوحة المفاتيح ==========
document.addEventListener("keydown", (e) => {
    if (!document.getElementById("quizScreen").classList.contains("active")) return;

    const q = currentQuestions[currentIndex];
    if (answered) {
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            nextQuestion();
        }
        return;
    }

    if (q.type === "mcq") {
        if (e.key === "1" || e.key === "a") selectAnswer(0);
        else if (e.key === "2" || e.key === "b") selectAnswer(1);
        else if (e.key === "3" || e.key === "c") selectAnswer(2);
        else if (e.key === "4" || e.key === "d") selectAnswer(3);
    } else {
        if (e.key === "1" || e.key === "t") selectAnswer(true);
        else if (e.key === "2" || e.key === "f") selectAnswer(false);
    }
});

// ========== بدء التطبيق ==========
init();
</script>
