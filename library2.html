<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة التفوق - مكتبة الـ PDF</title>
    <style>
        :root {
            --bg-color: #050a18;
            --container-bg: #0a1226;
            --accent-color: #00f2ff;
            --text-color: #ffffff;
            --secondary-text: #a0a0a0;
            --pdf-color: #ff4b4b; /* لون مميز لملفات PDF */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px 0;
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .tabs-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: flex;
            padding: 5px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--secondary-text);
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        .content-section {
            display: none;
            width: 100%;
            max-width: 800px;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .content-section.active { display: grid; }

        .item-link {
            text-decoration: none;
            background: var(--container-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            color: var(--text-color);
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .item-link::before {
            content: "📄"; /* أيقونة ملف */
            font-size: 24px;
        }

        .item-link:hover {
            border-color: var(--accent-color);
            transform: translateY(-5px);
            background: rgba(0, 242, 255, 0.05);
            box-shadow: 0 5px 15px rgba(0, 242, 255, 0.2);
        }
        
        /* علامة تمييز لملفات المحاضرات */
        #lectures .item-link::before {
            content: "📚"; 
        }
    </style>
</head>
<body>

    <div class="header">مكتبة التفوق 🚀</div>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="showSection('summaries', this)">📝 ملفات التلخيص</button>
        <button class="tab-btn" onclick="showSection('lectures', this)">📂 ملفات المحاضرات</button>
    </div>

    <div id="summaries" class="content-section active"></div>
    <div id="lectures" class="content-section"></div>

    <script>
        // --- ضع روابط ملفات الـ PDF هنا ---
        // ملاحظة: تأكد أن الرابط ينتهي بـ .pdf أو رابط مباشر للملف
        const summaryPdfLinks = [
            "https://drive.google.com/file/d/1n-fE_dLxQoT2wPVMduVd1RowF9PfenVL/view?usp=drivesdk", "path/to/summary2.pdf", "path/to/summary3.pdf",
            "path/to/summary4.pdf", "path/to/summary5.pdf", "path/to/summary6.pdf",
            "path/to/summary7.pdf", "path/to/summary8.pdf", "path/to/summary9.pdf",
            "path/to/summary10.pdf"
        ];

        const lecturePdfLinks = [
            "path/to/lecture1.pdf", "path/to/lecture2.pdf", "path/to/lecture3.pdf",
            "path/to/lecture4.pdf", "path/to/lecture5.pdf", "path/to/lecture6.pdf",
            "path/to/lecture7.pdf", "path/to/lecture8.pdf", "path/to/lecture9.pdf",
            "path/to/lecture10.pdf"
        ];

        function generateButtons() {
            const sumContainer = document.getElementById('summaries');
            const lecContainer = document.getElementById('lectures');

            for (let i = 0; i < 10; i++) {
                // أزرار التلخيص (PDF)
                let sumBtn = document.createElement('a');
                sumBtn.className = 'item-link';
                sumBtn.href = summaryPdfLinks[i];
                sumBtn.target = "_blank";
                sumBtn.innerText = `تحميل تلخيص ${i + 1}`;
                sumContainer.appendChild(sumBtn);

                // أزرار المحاضرات (PDF)
                let lecBtn = document.createElement('a');
                lecBtn.className = 'item-link';
                lecBtn.href = lecturePdfLinks[i];
                lecBtn.target = "_blank";
                lecBtn.innerText = `ملف محاضرة ${i + 1}`;
                lecContainer.appendChild(lecBtn);
            }
        }

        function showSection(sectionId, element) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            element.classList.add('active');
        }

        window.onload = generateButtons;
    </script>
</body>

</html>
