<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل ملاءمة المنحنيات | Curve Fitting Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-cyan: #00f2fe;
            --dark-cyan: #083344;
            --bg-deep: #020617;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(34, 211, 238, 0.2);
            --pink: #ff0077;
        }

        body {
            background: radial-gradient(circle at top, #0f172a, var(--bg-deep));
            color: white;
            font-family: 'Tajawal', sans-serif;
            margin: 0; 
            padding: 10px; /* تقليل الحواف الخارجية للهواتف */
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
        }

        .container { 
            width: 100%; 
            max-width: 1200px; 
            padding: 10px;
            box-sizing: border-box;
        }

        /* تحسين زر الرجوع للهواتف */
        .top-nav {
            width: 100%;
            display: flex;
            margin-bottom: 20px;
        }

        .btn-back {
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--primary-cyan);
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { 
            background: linear-gradient(90deg, #fff, var(--primary-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: clamp(1.5rem, 5vw, 2.5rem); /* خط مرن يكبر ويصغر مع الشاشة */
            margin: 10px 0;
        }

        /* --- نظام الشبكة المرن (The Responsive Grid) --- */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr; /* الافتراضي: عمود واحد (للهاتف) */
            gap: 20px;
        }

        /* للأجهزة الكبيرة (اللاب توب والديسك توب) */
        @media (min-width: 1025px) {
            .grid-layout {
                grid-template-columns: 380px 1fr; /* عمودين: تحكم + رسم */
            }
            body { padding: 30px; }
        }

        /* للأجهزة المتوسطة (التابلت) */
        @media (min-width: 768px) and (max-width: 1024px) {
            .grid-layout {
                grid-template-columns: 1fr; /* عمود واحد لترك مساحة للرسم */
            }
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: clamp(15px, 4vw, 30px); /* بادينج مرن */
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        textarea {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--primary-cyan);
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 16px; /* منع الزوم التلقائي في الآيفون */
            resize: none;
            box-sizing: border-box;
        }

        .btn-calc {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, var(--primary-cyan), #4facfe);
            border: none; border-radius: 12px;
            color: var(--dark-cyan); font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(34, 211, 238, 0.1);
            border-radius: 15px;
            border-right: 4px solid var(--primary-cyan);
        }

        .equation { 
            font-family: 'Courier New', monospace; 
            font-size: clamp(1rem, 3vw, 1.3rem); 
            word-break: break-all; /* لمنع خروج النص الطويل عن الإطار في الهواتف */
        }

        /* ضبط ارتفاع الرسم البياني حسب الجهاز */
        .chart-container { 
            position: relative; 
            height: 300px; /* للهواتف */
            width: 100%; 
        }

        @media (min-width: 768px) {
            .chart-container { height: 450px; } /* للتابلت */
        }
        
        @media (min-width: 1025px) {
            .chart-container { height: 550px; } /* للابتوب */
        }

        footer { margin: 30px 0; color: #64748b; font-size: 12px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <a href="dashboard.html" class="btn-back">
            <span>&#10095;</span> الرجوع
        </a>
    </div>

    <div class="header">
        <h1>Curve Fitting Analyzer</h1>
        <p style="color: #64748b; font-size: 14px;">تحليل البيانات وإيجاد أفضل ملاءمة خطية</p>
    </div>

    <div class="grid-layout">
        <div class="glass-card">
            <div class="input-group">
                <label>إحداثيات X:</label>
                <textarea id="xValues" rows="3">1, 2, 3, 4, 5, 6</textarea>
            </div>
            <div class="input-group">
                <label>إحداثيات Y:</label>
                <textarea id="yValues" rows="3">2.2, 3.8, 6.5, 8.0, 10.2, 12.1</textarea>
            </div>
            <button class="btn-calc" onclick="calculateFit()">تحليل البيانات ✨</button>

            <div id="results" class="result-box" style="display:none;">
                <label>معادلة الخط:</label>
                <div class="equation" id="eqText"></div>
                <div style="display: flex; justify-content: space-between; margin-top:15px; font-size: 13px;">
                    <span style="color: #94a3b8;">دقة الملاءمة (R²):</span>
                    <span id="rSquared" style="color: var(--primary-cyan);"></span>
                </div>
                <button class="btn-export" onclick="exportChart()" style="margin-top:15px; width:100%; padding:10px; background:transparent; border:1px solid var(--primary-cyan); color:var(--primary-cyan); border-radius:10px; cursor:pointer;">
                    📥 حفظ كصورة PNG
                </button>
            </div>
        </div>

        <div class="glass-card">
            <div class="chart-container">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </div>
</div>

<footer>
    مبرمج بواسطة <b>Ahmed El_Samahy</b> | 2026 ©
</footer>

<script>
    let chart;

    function calculateFit() {
        const xRaw = document.getElementById('xValues').value.split(/[\s,]+/).filter(v => v !== "").map(Number);
        const yRaw = document.getElementById('yValues').value.split(/[\s,]+/).filter(v => v !== "").map(Number);

        if (xRaw.length !== yRaw.length || xRaw.length < 2) {
            alert("يرجى التأكد من تساوي عدد قيم X و Y.");
            return;
        }

        const n = xRaw.length;
        let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0, sumY2 = 0;
        for (let i = 0; i < n; i++) {
            sumX += xRaw[i]; sumY += yRaw[i];
            sumXY += xRaw[i] * yRaw[i];
            sumX2 += xRaw[i] * xRaw[i]; sumY2 += yRaw[i] * yRaw[i];
        }

        const m = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
        const c = (sumY - m * sumX) / n;
        const r2 = Math.pow((n * sumXY - sumX * sumY) / Math.sqrt((n * sumX2 - sumX * sumX) * (n * sumY2 - sumY * sumY)), 2);

        document.getElementById('results').style.display = 'block';
        document.getElementById('eqText').innerText = `y = ${m.toFixed(2)}x ${c >= 0 ? '+' : '-'} ${Math.abs(c).toFixed(2)}`;
        document.getElementById('rSquared').innerText = (r2 * 100).toFixed(2) + "%";

        renderChart(xRaw, yRaw, m, c);
    }

    function renderChart(xRaw, yRaw, m, c) {
        if (chart) chart.destroy();
        const ctx = document.getElementById('myChart').getContext('2d');
        
        const minX = Math.min(...xRaw);
        const maxX = Math.max(...xRaw);

        chart = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [{
                    label: 'النقاط',
                    data: xRaw.map((x, i) => ({ x: x, y: yRaw[i] })),
                    backgroundColor: '#00f2fe',
                }, {
                    label: 'خط الملاءمة',
                    data: [{x: minX, y: m*minX+c}, {x: maxX, y: m*maxX+c}],
                    type: 'line',
                    borderColor: '#ff0077',
                    borderWidth: 2,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }
                }
            }
        });
    }

    function exportChart() {
        if (!chart) return;
        const link = document.createElement('a');
        link.download = 'Analysis.png';
        link.href = chart.toBase64Image();
        link.click();
    }

    window.onload = calculateFit;
</script>
</body>
</html>
