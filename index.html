<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEVA | Robotics &amp; ML</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<style>
:root{
--navy:#010818;
--glow:#2aa8ff;
--electric:#1478ff;
--royal:#0a4dff;
--silver:#e8eefc;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:radial-gradient(circle at top,#08265a,#010818 70%);
overflow-x:hidden;
}

#particles-js{position:fixed;inset:0;z-index:0;}

/* CARD */
.card{
position:relative;
z-index:1;
width:min(95%,580px);
padding:40px 40px 50px;
border-radius:30px;
text-align:center;
color:#fff;
background:rgba(1,8,24,.92);
backdrop-filter:blur(20px);
border:1px solid rgba(42,168,255,.18);
box-shadow:0 0 20px rgba(42,168,255,.10),0 0 45px rgba(20,120,255,.06);
overflow:hidden;
}

/* Shimmer border */
.card::before{
content:"";
position:absolute;
inset:0;
padding:2px;
border-radius:30px;
background:linear-gradient(120deg,var(--silver),var(--glow),var(--royal),var(--glow),var(--silver));
background-size:400% 400%;
animation:premiumGlow 8s ease infinite;
-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
-webkit-mask-composite:xor;
mask-composite:exclude;
pointer-events:none;
z-index:0;
}

.card::after{
content:"";
position:absolute;
inset:2px;
border-radius:28px;
background:rgba(1,8,24,.97);
z-index:-1;
}

.card > *{position:relative;z-index:2;}

@keyframes premiumGlow{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* LOGO */
.logo-wrap{
width:min(100%,340px);
margin:0 auto 10px;
}

.logo{
display:block;
width:100%;
height:auto;
border-radius:24px;
/* fade image edges into the card */
-webkit-mask-image:radial-gradient(ellipse at center,#000 62%,transparent 100%);
mask-image:radial-gradient(ellipse at center,#000 62%,transparent 100%);
filter:drop-shadow(0 0 22px rgba(42,168,255,.35));
animation:float 6s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-6px);}
}

.sr-only{
position:absolute;
width:1px;height:1px;
overflow:hidden;
clip:rect(0 0 0 0);
white-space:nowrap;
}

.subtitle{
color:var(--silver);
font-weight:700;
font-size:1.15rem;
letter-spacing:6px;
margin:6px 0 25px;
}

.metrics{display:flex;gap:10px;margin:25px 0;}

.metric{
flex:1;
padding:12px;
border-radius:14px;
background:rgba(42,168,255,.06);
border:1px solid rgba(42,168,255,.25);
font-size:.85rem;
color:var(--silver);
}

.metric b{
display:block;
font-size:1.2rem;
color:var(--glow);
}

.bar{height:8px;background:#0a1a38;border-radius:20px;overflow:hidden;}

.bar span{
display:block;
height:100%;
background:linear-gradient(90deg,var(--silver),var(--glow),var(--royal));
animation:load 3s infinite;
}

@keyframes load{
0%{width:15%}
50%{width:90%}
100%{width:15%}
}

.datetime-box{margin:25px 0;}

.clock{font-size:2rem;color:var(--silver);font-weight:700;}

.date{margin-top:8px;color:#8cc8ff;}

.btn{
display:inline-block;
padding:16px 40px;
background:linear-gradient(135deg,var(--glow),var(--royal));
color:#fff;
font-weight:700;
text-decoration:none;
border-radius:16px;
transition:.3s;
}

.btn:hover,.btn:focus-visible{
transform:translateY(-3px);
box-shadow:0 0 28px var(--glow);
outline:none;
}

@media (prefers-reduced-motion:reduce){
.logo,.card::before,.bar span{animation:none;}
}

/* Mobile */
@media(max-width:480px){
.card{width:100%;padding:24px 18px 34px;border-radius:22px;}
.metrics{flex-direction:column;}
.clock{font-size:1.6rem;}
}
</style>
</head>
