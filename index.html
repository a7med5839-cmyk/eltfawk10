<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Faculty - JARVIS Edition</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<style>
:root{
--cyan:#00ffff;
--electric:#00aaff;
--royal:#0072ff;
--dark:#020b16;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle at top,#07233b,#020b16 70%);
overflow:hidden;
}

#particles-js{
position:fixed;
inset:0;
z-index:0;
}

.card{
position:relative;
z-index:1;
width:580px;
padding:70px 50px;
border-radius:35px;
background:rgba(5,15,25,.85);
backdrop-filter:blur(20px);
border:1px solid rgba(0,255,255,.15);
box-shadow:0 0 40px rgba(0,255,255,.15);
color:white;
text-align:center;
}

.card:before{
content:'';
position:absolute;
inset:-2px;
border-radius:35px;
z-index:-2;
background:conic-gradient(from 0deg,var(--cyan),var(--electric),var(--royal),var(--cyan));
animation:spin 8s linear infinite;
}

.card:after{
content:'';
position:absolute;
inset:2px;
border-radius:33px;
background:rgba(2,11,22,.97);
z-index:-1;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

.robot{
width:150px;
height:150px;
border-radius:50%;
margin:auto auto 25px;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle,var(--cyan),var(--royal));
box-shadow:0 0 40px var(--cyan);
position:relative;
}

.robot:before{
content:'';
position:absolute;
width:190px;
height:190px;
border-radius:50%;
border:2px solid rgba(0,255,255,.3);
animation:spin 10s linear infinite;
}

.robot:after{
content:'';
position:absolute;
width:230px;
height:230px;
border-radius:50%;
border:1px dashed rgba(0,255,255,.25);
animation:spin 16s linear infinite reverse;
}

h1{
font-size:3.5rem;
background:linear-gradient(90deg,#fff,var(--cyan),#fff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-size:200% auto;
animation:shine 4s linear infinite;
}

@keyframes shine{
to{background-position:200% center;}
}

.subtitle{
color:var(--cyan);
letter-spacing:3px;
margin:10px 0 20px;
}

.description{
opacity:.85;
line-height:1.8;
margin-bottom:20px;
}

.metrics{
display:flex;
gap:10px;
margin:25px 0;
}

.metric{
flex:1;
padding:12px;
border:1px solid rgba(0,255,255,.2);
border-radius:14px;
background:rgba(0,255,255,.05);
}

.metric b{
display:block;
color:var(--cyan);
font-size:1.3rem;
}

.bar{
height:8px;
background:#123;
border-radius:20px;
overflow:hidden;
}

.bar span{
display:block;
height:100%;
background:linear-gradient(90deg,var(--cyan),var(--electric));
animation:load 3s infinite;
}

@keyframes load{
0%{width:15%}
50%{width:90%}
100%{width:15%}
}

.datetime-box{
margin:25px 0;
text-align:center;
}

.clock{
font-size:2rem;
font-weight:700;
color:var(--cyan);
letter-spacing:4px;
text-shadow:0 0 10px rgba(0,255,255,.8),0 0 20px rgba(0,255,255,.5);
}

.date{
margin-top:8px;
color:#9eefff;
font-size:1rem;
letter-spacing:2px;
}

.btn{
display:inline-block;
padding:16px 40px;
border-radius:18px;
text-decoration:none;
color:#001;
background:var(--cyan);
font-weight:700;
transition:.3s;
}

.btn:hover{
transform:translateY(-4px);
box-shadow:0 0 30px var(--cyan);
}
</style>
</head>
<body>

<div id="particles-js"></div>

<div class="card">

<div class="robot">
<svg width="70" viewBox="0 0 24 24" fill="white">
<path d="M12,2A2,2 0 0,1 14,4C14,4.74 13.59,5.39 13,5.73V7H14A7,7 0 0,1 21,14V16H19V14A5,5 0 0,0 14,9H10A5,5 0 0,0 5,14V16H3V14A7,7 0 0,1 10,7H11V5.73C10.41,5.39 10,4.74 10,4A2,2 0 0,1 12,2"/>
</svg>
</div>

<h1>ذكاء اصطناعي</h1>

<div class="subtitle">FACULTY OF ARTIFICIAL INTELLIGENCE</div>


<div class="metrics">
<div class="metric"><b>AI</b>CORE</div>
<div class="metric"><b>24/7</b>ONLINE</div>
<div class="metric"><b>99.8%</b>SYSTEM</div>
</div>

<div class="bar"><span></span></div>

<div class="datetime-box">
<div class="clock" id="clock">00:00:00</div>
<div class="date" id="date">01 January 2026</div>
</div>

<a class="btn" href="dashboard.html">⚡ دخول الكلية</a>

</div>

<script>
particlesJS("particles-js",{
particles:{
number:{value:90},
color:{value:"#00ffff"},
line_linked:{enable:true,color:"#00ffff"},
move:{enable:true,speed:2},
size:{value:3}
}
});

function updateDateTime(){
const now = new Date();

document.getElementById("clock").innerHTML =
now.toLocaleTimeString('en-GB');

document.getElementById("date").innerHTML =
now.toLocaleDateString('ar-EG',{
day:'2-digit',
month:'long',
year:'numeric'
});
}

setInterval(updateDateTime,1000);
updateDateTime();
</script>

</body>
</html>
