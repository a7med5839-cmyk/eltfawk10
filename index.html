<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Faculty </title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<style>
:root{
--cyan:#00ffff;
--electric:#00aaff;
--royal:#0072ff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:radial-gradient(circle at top,#07233b,#020b16 70%);
overflow-x:hidden;
}

#particles-js{
position:fixed;
inset:0;
z-index:0;
}

/* CARD */
.card{
position:relative;
z-index:1;
width:min(95%,580px);
padding:60px 40px;
border-radius:30px;
text-align:center;
color:#fff;
background:rgba(5,15,25,.92);
backdrop-filter:blur(20px);
border:1px solid rgba(0,255,255,.15);
box-shadow:
0 0 15px rgba(0,255,255,.08),
0 0 30px rgba(0,170,255,.04);
overflow:hidden;
}

/* Premium Shimmer Border (FIXED) */
.card::before{
content:"";
position:absolute;
inset:0;
padding:2px;
border-radius:30px;

background:linear-gradient(
120deg,
#00ffff,
#00aaff,
#0072ff,
#00aaff,
#00ffff
);

background-size:400% 400%;
animation:premiumGlow 8s ease infinite;

/* إزالة السبب الرئيسي للمشكلة */
filter:none;

-webkit-mask:
linear-gradient(#fff 0 0) content-box,
linear-gradient(#fff 0 0);

-webkit-mask-composite:xor;
mask-composite:exclude;

pointer-events:none;
z-index:0;
}

/* الخلفية الداخلية */
.card::after{
content:"";
position:absolute;
inset:2px;
border-radius:28px;
background:rgba(2,11,22,.97);
z-index:-1;
}

/* ضمان ظهور المحتوى فوق كل شيء */
.card > *{
position:relative;
z-index:2;
}

@keyframes premiumGlow{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* ROBOT */
.robot{
width:140px;
height:140px;
margin:auto auto 25px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle,var(--cyan),var(--royal));
box-shadow:0 0 35px var(--cyan);
position:relative;
}

.robot:before,
.robot:after{
content:'';
position:absolute;
border-radius:50%;
}

.robot:before{
width:180px;
height:180px;
border:2px solid rgba(0,255,255,.3);
animation:orbit 10s linear infinite;
}

.robot:after{
width:220px;
height:220px;
border:1px dashed rgba(0,255,255,.25);
animation:orbit 16s linear infinite reverse;
}

@keyframes orbit{
to{transform:rotate(360deg);}
}

h1{
font-size:3rem;
background:linear-gradient(90deg,#fff,var(--cyan),#fff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
color:var(--cyan);
letter-spacing:2px;
margin:10px 0 25px;
}

.metrics{
display:flex;
gap:10px;
margin:25px 0;
}

.metric{
flex:1;
padding:12px;
border-radius:14px;
background:rgba(0,255,255,.05);
border:1px solid rgba(0,255,255,.2);
}

.metric b{
display:block;
font-size:1.2rem;
color:var(--cyan);
}

.bar{
height:8px;
background:#123;
border-radius:20px;
overflow:hidden;
}

.bar span{
display:block;
height:100%;
background:linear-gradient(90deg,var(--cyan),var(--electric));
animation:load 3s infinite;
}

@keyframes load{
0%{width:15%}
50%{width:90%}
100%{width:15%}
}

.datetime-box{
margin:25px 0;
}

.clock{
font-size:2rem;
color:var(--cyan);
font-weight:700;
}

.date{
margin-top:8px;
color:#9eefff;
}

.btn{
display:inline-block;
padding:16px 40px;
background:var(--cyan);
color:#001;
font-weight:700;
text-decoration:none;
border-radius:16px;
transition:.3s;
}

.btn:hover{
transform:translateY(-3px);
box-shadow:0 0 25px var(--cyan);
}

/* Mobile */
@media(max-width:480px){
.card{
width:100%;
padding:30px 18px;
border-radius:22px;
}

h1{font-size:1.8rem;}
.metrics{flex-direction:column;}
.robot{width:85px;height:85px;}
}
</style>
</head>

<body>

<div id="particles-js"></div>

<div class="card">

<div class="robot">
<svg width="70" viewBox="0 0 24 24" fill="white">
<path d="M12,2A2,2 0 0,1 14,4C14,4.74 13.59,5.39 13,5.73V7H14A7,7 0 0,1 21,14V16H19V14A5,5 0 0,0 14,9H10A5,5 0 0,0 5,14V16H3V14A7,7 0 0,1 10,7H11V5.73C10.41,5.39 10,4.74 10,4A2,2 0 0,1 12,2"/>
</svg>
</div>

<h1>ذكاء اصطناعي</h1>

<div class="subtitle">
FACULTY OF ARTIFICIAL INTELLIGENCE
</div>

<div class="metrics">
<div class="metric"><b>AI</b>CORE</div>
<div class="metric"><b>24/7</b>ONLINE</div>
<div class="metric"><b>99.8%</b>SYSTEM</div>
</div>

<div class="bar"><span></span></div>

<div class="datetime-box">
<div class="clock" id="clock"></div>
<div class="date" id="date"></div>
</div>

<a class="btn" href="dashboard.html">⚡ دخول الكلية</a>

</div>

<script>
particlesJS("particles-js",{
particles:{
number:{value:70},
color:{value:"#00ffff"},
line_linked:{enable:true,color:"#00ffff"},
move:{enable:true,speed:2},
size:{value:3}
}
});

function updateDateTime(){
const now = new Date();

document.getElementById("clock").textContent =
now.toLocaleTimeString("en-GB");

document.getElementById("date").textContent =
now.toLocaleDateString("ar-EG",{day:"2-digit",month:"long",year:"numeric"});
}

setInterval(updateDateTime,1000);
updateDateTime();
</script>

</body>
</html>
