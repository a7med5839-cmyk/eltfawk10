<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numerical Analysis - Complete Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --accent-cyan: #00f5ff;
            --accent-blue: #0066ff;
            --text-primary: #e0f7ff;
            --text-secondary: #7dd3fc;
            --border-glow: rgba(0, 245, 255, 0.4);
            --correct: #00ff88;
            --incorrect: #ff4757;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .font-display { font-family: 'Orbitron', sans-serif; }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            padding: 1rem;
        }

        /* Cards & Containers */
        .quiz-card {
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.95), rgba(10, 14, 23, 0.98));
            border: 1px solid var(--border-glow);
            border-radius: 1.5rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 60px rgba(0, 245, 255, 0.1);
        }

        /* Progress & Navigation */
        .progress-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 2rem;
            overflow: hidden;
            height: 8px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
            border-radius: 2rem;
            transition: width 0.5s ease;
            box-shadow: 0 0 20px var(--accent-cyan);
        }

        .nav-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-dot.answered { background: var(--accent-blue); border-color: var(--accent-cyan); }
        .nav-dot.current { transform: scale(1.4); background: var(--accent-cyan); border-color: var(--accent-cyan); }
        .nav-dot.correct { background: var(--correct); border-color: var(--correct); }
        .nav-dot.incorrect { background: var(--incorrect); border-color: var(--incorrect); }

        /* Options */
        .option-btn {
            width: 100%;
            padding: 1rem 1.5rem;
            text-align: right;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent-cyan);
            background: rgba(0, 245, 255, 0.05);
            transform: translateX(-5px);
        }

        .option-btn.correct {
            border-color: var(--correct);
            background: rgba(0, 255, 136, 0.15);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }

        .option-btn.incorrect {
            border-color: var(--incorrect);
            background: rgba(255, 71, 87, 0.15);
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.2);
        }

        .option-btn:disabled { cursor: default; }

        .option-letter {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(0, 245, 255, 0.1);
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* Math & Tables Formatting */
        .math-block {
            font-family: 'Times New Roman', serif;
            font-size: 1.1rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            display: inline-block;
            margin: 0.5rem 0;
        }
        
        .matrix {
            display: inline-grid;
            grid-template-columns: repeat(auto-fit, minmax(20px, 1fr));
            gap: 5px;
            padding: 5px;
            border-left: 2px solid var(--accent-cyan);
            border-right: 2px solid var(--accent-cyan);
            border-radius: 4px;
            background: rgba(0,0,0,0.1);
            vertical-align: middle;
            margin: 0 5px;
        }

        table {
            border-collapse: collapse;
            margin: 0.5rem auto;
            font-size: 0.9rem;
        }

        th, td {
            border: 1px solid rgba(0, 245, 255, 0.3);
            padding: 0.4rem 0.8rem;
            text-align: center;
        }

        th {
            background: rgba(0, 245, 255, 0.1);
            color: var(--accent-cyan);
        }

        /* Buttons */
        .nav-btn {
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, rgba(0, 102, 255, 0.3), rgba(0, 245, 255, 0.2));
            border: 1px solid var(--accent-cyan);
            border-radius: 0.75rem;
            color: var(--accent-cyan);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(0, 102, 255, 0.5), rgba(0, 245, 255, 0.4));
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
        }

        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .nav-btn.primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan)); color: var(--bg-primary); }

        .section-tab {
            padding: 0.5rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .section-tab.active {
            background: rgba(0, 245, 255, 0.15);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Feedback & Results */
        .feedback-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            font-weight: 600;
            animation: fadeInUp 0.4s ease;
        }

        .feedback-badge.correct { background: rgba(0, 255, 136, 0.1); border: 1px solid var(--correct); color: var(--correct); }
        .feedback-badge.incorrect { background: rgba(255, 71, 87, 0.1); border: 1px solid var(--incorrect); color: var(--incorrect); }

        .score-circle {
            width: 160px; height: 160px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-cyan) calc(var(--score) * 3.6deg), rgba(255, 255, 255, 0.1) 0);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .score-circle::before {
            content: ''; position: absolute; width: 130px; height: 130px;
            background: var(--bg-secondary); border-radius: 50%;
        }
        .score-value {
            position: relative; z-index: 1; font-size: 2.5rem; font-weight: 900;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive */
        @media (max-width: 640px) {
            .section-tabs { overflow-x: auto; padding-bottom: 0.5rem; -webkit-overflow-scrolling: touch; }
            .nav-dots { gap: 6px; }
            .quiz-card { padding: 1rem; }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="main-container max-w-4xl mx-auto py-8">
        <!-- Header -->
        <header class="text-center mb-6 animate-in">
            <h1 class="font-display text-2xl md:text-3xl font-bold mb-1" style="background: linear-gradient(135deg, #00f5ff, #0066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                Numerical Analysis
            </h1>
            <p class="text-sm text-cyan-300">Interactive Quiz System</p>
        </header>

        <!-- Start Screen -->
        <div id="start-screen" class="quiz-card p-6 md:p-8 animate-in">
            <div class="text-center mb-6">
                <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gradient-to-br from-cyan-500/20 to-blue-500/20 flex items-center justify-center border border-cyan-500/30">
                    <svg class="w-10 h-10 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                    </svg>
                </div>
                <h2 class="font-display text-xl font-bold mb-2 text-cyan-300">Ready for the Challenge?</h2>
                <p class="text-gray-400 text-sm mb-4">33 Questions covering Quizzes & Mid-Terms</p>
            </div>

            <div class="grid grid-cols-3 gap-3 mb-6 text-center">
                <div class="p-3 rounded-xl bg-black/30 border border-white/10">
                    <div class="text-xl font-bold text-cyan-400">33</div>
                    <div class="text-xs text-gray-500">Questions</div>
                </div>
                <div class="p-3 rounded-xl bg-black/30 border border-white/10">
                    <div class="text-xl font-bold text-cyan-400">6</div>
                    <div class="text-xs text-gray-500">Sections</div>
                </div>
                <div class="p-3 rounded-xl bg-black/30 border border-white/10">
                    <div class="text-xl font-bold text-cyan-400">Instant</div>
                    <div class="text-xs text-gray-500">Feedback</div>
                </div>
            </div>

            <button onclick="startQuiz()" class="nav-btn primary w-full py-3 text-lg font-bold rounded-xl">
                Start Quiz
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <!-- Section Tabs -->
            <div class="section-tabs flex gap-2 mb-4 overflow-x-auto pb-2" id="section-tabs"></div>

            <!-- Progress -->
            <div class="quiz-card p-4 mb-4">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-gray-400">Progress</span>
                    <div class="flex gap-3 items-center">
                        <span class="text-xs font-bold text-green-400" id="live-score">Score: 0/0</span>
                        <span class="text-xs font-bold text-cyan-400" id="progress-text">0 / 33</span>
                    </div>
                </div>
                <div class="progress-container mb-3">
                    <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
                </div>
                <div class="nav-dots flex gap-1.5 flex-wrap justify-center" id="nav-dots"></div>
            </div>

            <!-- Question Card -->
            <div class="quiz-card p-6 md:p-8" id="question-card">
                <div class="flex justify-between items-start mb-4">
                    <div class="flex-1">
                        <span class="text-xs font-bold text-cyan-500 uppercase tracking-wider" id="section-label">Quiz 1</span>
                        <h3 class="text-base md:text-lg font-bold mt-1" id="question-number">Question 1 of 33</h3>
                    </div>
                </div>

                <div class="mb-5 text-base" id="question-text"></div>
                <div class="space-y-2" id="options-container"></div>
                
                <div id="feedback-area" class="mt-5 text-center"></div>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex justify-between gap-4 mt-4">
                <button onclick="prevQuestion()" class="nav-btn flex-1 text-sm" id="prev-btn">Previous</button>
                <button onclick="nextQuestion()" class="nav-btn primary flex-1 text-sm" id="next-btn">Next</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="hidden">
            <div class="quiz-card p-8 text-center animate-in">
                <h2 class="font-display text-2xl font-bold mb-6 text-cyan-300">Exam Complete</h2>
                
                <div class="score-circle mx-auto mb-6" id="score-circle" style="--score: 0">
                    <span class="score-value" id="score-value">0%</span>
                </div>

                <div class="grid grid-cols-3 gap-3 mb-6">
                    <div class="p-3 rounded-xl bg-black/30 border border-white/10">
                        <div class="text-xl font-bold text-green-400" id="correct-count">0</div>
                        <div class="text-xs text-gray-500">Correct</div>
                    </div>
                    <div class="p-3 rounded-xl bg-black/30 border border-white/10">
                        <div class="text-xl font-bold text-red-400" id="incorrect-count">0</div>
                        <div class="text-xs text-gray-500">Incorrect</div>
                    </div>
                    <div class="p-3 rounded-xl bg-black/30 border border-white/10">
                        <div class="text-xl font-bold text-gray-400" id="unanswered-count">0</div>
                        <div class="text-xs text-gray-500">Skipped</div>
                    </div>
                </div>

                <div class="space-y-2">
                    <button onclick="reviewAnswers()" class="nav-btn w-full py-2 text-sm">Review Answers</button>
                    <button onclick="restartQuiz()" class="nav-btn primary w-full py-2 text-sm">Retake Quiz</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== DATA PARSING ====================
        const quizData = [
            { section: "Quiz 1", questions: [
                { question: "Curve fitting is a technique for:", options: ["Finding relationship between two variables", "Comparing the two series", "Obtaining most likely missing links", "None of these"], correct: 0 },
                { question: "The Lagrange interpolation formula is used for:", options: ["Equal intervals and unequal intervals", "Unequal intervals", "Equal intervals", "None of these"], correct: 0 },
                { question: "Fit the straight line to the following data:<br><table><tr><th>x</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr><tr><th>y</th><td>1</td><td>5</td><td>11</td><td>8</td><td>14</td></tr></table>", options: ["y = -0.9 + 2.9x", "y = 0.9 − 2.9x", "y = 2 − 4x", "None of these"], correct: 0 },
                { question: "Newton's forward formula is used when the interpolating value lies:", options: ["In the beginning of series", "At the end of series", "In the middle of series", "None of these"], correct: 0 },
                { question: "Apply Lagrange's formula where y = 19 in the following table:<br><table><tr><th>x</th><td>0</td><td>2</td><td>2</td></tr><tr><th>y</th><td>0</td><td>1</td><td>20</td></tr></table>", options: ["3.8", "2.8", "3", "None of these"], correct: 0 }
            ]},
            { section: "Quiz 2", questions: [
                { question: "The values of y = f(x) are given below. Find f(32) using Newton's interpolation:<br><table><tr><th>x</th><td>30</td><td>35</td><td>40</td><td>45</td></tr><tr><th>y</th><td>0.500</td><td>0.5736</td><td>0.6428</td><td>0.7071</td></tr></table>", options: ["0.5296", "0.549", "0.550", "None of these"], correct: 0 },
                { question: "In LU factorization, let A = <div class='matrix'>2 -4 6<br>4 -7 8<br>3 -5 2</div>. Find the upper matrix U:", options: ["<div class='matrix'>2 0 0<br>4 1 0<br>3 1 -3</div>", "<div class='matrix'>2 0 0<br>4 1 0<br>3 1 3</div>", "<div class='matrix'>2 0 0<br>4 1 0<br>3 1 5</div>", "None of these"], correct: 0 },
                { question: "Calculate the integral: I = ∫<sub>a</sub><sup>∞</sup> e<sup>(2ax−x²)</sup> dx", options: ["I = (1/2) e<sup>a²</sup> √π", "I = (1/2) e<sup>a²</sup> π", "I = e<sup>a²</sup> √π", "None of these"], correct: 0 },
                { question: "The function f(x) = x³ + 2x − 2 = 0 has a root in [0,1]. Find the root using Bisection Method.", options: ["x<sub>m</sub> = 0.8125", "x<sub>m</sub> = 0.720", "x<sub>m</sub> = 0.956", "None of these"], correct: 0 },
                { question: "Find the Eigen-values of matrix A = <div class='matrix'>-2 0 0<br>1 4 0<br>-3 2 -1</div>:", options: ["-2, 4, -1", "-2, -4, -1", "-3, 1, 2", "-3, 4, 1"], correct: 0 }
            ]},
            { section: "Mid-Term (1)", questions: [
                { question: "In curve fitting, find the suitable substitution to convert: y = 1/(a + b·cos θ) to linear form Y = A + BX", options: ["Y = 1/y, X = cos θ, A = a, B = b", "Y = 1/y, X = cos θ, A = e<sup>a</sup>, B = e<sup>b</sup>", "Y = y, X = cos θ, A = a, B = b", "None of these"], correct: 0 },
                { question: "Fit the curve y = a + bx to the following readings:<br><table><tr><th>x</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr><tr><th>y</th><td>1</td><td>5</td><td>11</td><td>8</td><td>14</td></tr></table>", options: ["y = −0.9 + 2.9x", "y = 2 − 4x", "y = 0.9 − 2.9x", "None of these"], correct: 0 },
                { question: "Which of the following methods is used to find the real roots of the equations?", options: ["False position", "Runge-Kutta", "Euler's", "None of these"], correct: 0 },
                { question: "Construct the Lagrange interpolation polynomial for x₀=0, x₁=1/6, x₂=1/2 and y = sin(πx):", options: ["p₂(x) = −3x² + (7/2)x", "p₂(x) = 3x² + (7/2)x", "p₂(x) = −3x² − (7/2)x", "None of these"], correct: 0 },
                { question: "The eigen vectors of matrix A are the solutions to which equation?", options: ["AX = λX", "AX = X", "AX = 0", "A∗X = I"], correct: 0 },
                { question: "What is an eigen value?", options: ["A scalar associated with a matrix", "A vector in the matrix", "A type of matrix transformation", "A determinant of a matrix"], correct: 0 },
                { question: "Find Eigen values of A = <div class='matrix'>0 2<br>3 5</div>:", options: ["λ₁ = 6, λ₂ = −1", "λ₁ = 1, λ₂ = −2", "λ₁ = 3, λ₂ = 2", "None of these"], correct: 0 }
            ]},
            { section: "Mid-Term (2)", questions: [
                { question: "If the equation y = e<sup>(a+bx)</sup> can be written in linear form Y = A + BX, what are Y, X, B, A?", options: ["Y = ln y, A = a, B = b, X = x", "Y = y, A = a, B = b, X = x", "Y = y, A = a, B = ln b, X = ln x", "Y = ln y, A = a, B = ln b, X = x"], correct: 0 },
                { question: "Which of the following is one the normal equation of y = bx + a?", options: ["∑y = b∑x + n a", "∑y = nb + a∑x", "∑y = b∑x + a", "∑xy = b∑x² + n a"], correct: 0 },
                { question: "If y = ln(x), Calculate ln(2) by using Lagrange interpolation, where ln(1)=0, ln(4)=1.386294, ln(6)=1.791759", options: ["0.565844", "0.885844", "0.398101", "None of these"], correct: 0 },
                { question: "Which of the following formula is not used in interpolation?", options: ["Least square approximation formula", "Newton’s forward difference formula", "Lagrange’s formula", "Newton’s backward difference formula"], correct: 0 },
                { question: "Which of the following methods is used to find the real roots of the equations:", options: ["Bisection", "Runge_Kutta", "Euler’s", "None of these"], correct: 0 },
                { question: "Find real root of f(x) = x³ − 5x + 1 lies in the interval [0,1], perform three iterations of the Secant method:", options: ["x<sub>i+1</sub> = 0.2017135", "x<sub>i+1</sub> = 0.671356", "x<sub>m</sub> = 0.75", "None of these"], correct: 0 },
                { question: "Find Eigen values of A = <div class='matrix'>3 -2<br>-1 2</div>:", options: ["λ₁ = 4, λ₂ = 1", "λ₁ = 2, λ₂ = 3", "λ₁ = 3, λ₂ = −1", "None of these"], correct: 0 }
            ]},
            { section: "Mid-Term (3)", questions: [
                { question: "If the equation y = a + b x⁵ can be written in linear form Y = A + BX, what are Y, X, B, A?", options: ["Y = y, A = a, B = b, X = x⁵", "Y = y, A = a, B = b, X = x", "Y = y, A = a, B = ln b, X = ln x", "Y = ln y, A = a, B = ln b, X = x⁵"], correct: 0 },
                { question: "Fit the curve y = a + bx to the following readings:<br><table><tr><th>x</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr><tr><th>y</th><td>1</td><td>5</td><td>11</td><td>8</td><td>14</td></tr></table>", options: ["y = −0.9 + 2.9x", "y = 2 − 4x", "y = 0.9 − 2.9x", "None of these"], correct: 0 },
                { question: "Which of the following formula is used in interpolation?", options: ["Lagrange’s formula", "Bisection method formula", "Least square approximation formula", "Secant formula"], correct: 0 },
                { question: "Which of the following methods is used to find the real roots of the equations:", options: ["Secant", "Runge_Kutta", "Euler’s", "None of these"], correct: 0 },
                { question: "Find real root of f(x) = x³ + 4x² − 10 lies in the interval [1,2], perform three iterations of False position method:", options: ["x<sub>r</sub> = 1.35854634", "x<sub>r</sub> = 1.8574634", "x<sub>r</sub> = 1.023434", "None of these"], correct: 0 },
                { question: "The eigen vector of matrix A = <div class='matrix'>2 1<br>10 -1</div> corresponding to eigen value λ=4 is:", options: ["[[1], [2]]", "[[1], [1]]", "[[1], [-2]]", "[[2], [-1]]"], correct: 0 },
                { question: "For a 2x2 matrix, what is the maximum number of distinct eigen values it can have?", options: ["2", "3", "1", "4"], correct: 0 }
            ]},
            { section: "Mid-Term (4)", questions: [
                { question: "If the equation y = a + b sin θ can be written in linear form Y = A + BX, what are Y, X, B, A?", options: ["Y = y, A = a, B = b, X = sin θ", "Y = y, A = a, B = b, X = x", "Y = y, A = a, B = ln b, X = ln x", "Y = ln y, A = a, B = ln b, X = sin θ"], correct: 0 },
                { question: "Which of the following is one the normal equation of y = a + bx?", options: ["∑y = n a + b ∑x", "∑y = a ∑x + n b", "∑y = a + b ∑x", "∑xy = n a + b ∑x²"], correct: 0 },
                { question: "Find f(1.8) by Newton's interpolation for the following table:<br><table><tr><th>x</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>y</th><td>-1</td><td>3</td><td>13</td><td>29</td><td>51</td></tr></table>", options: ["f(1.8) = 44.56", "f(1.8) = 48.56", "f(1.8) = 40.56", "None of these"], correct: 0 },
                { question: "The following function(s) can be used for interpolation:", options: ["All of the above", "Polynomial", "Exponential", "Trigonometric"], correct: 0 },
                { question: "The function f(x) = x³ + 2x − 2 has a root in the interval [0,1], find the root using the Bisection method:", options: ["x<sub>m</sub> = 0.8125", "x<sub>m</sub> = 0.720", "x<sub>m</sub> = 0.956", "None of these"], correct: 0 },
                { question: "The eigen vector of matrix A = <div class='matrix'>2 1<br>10 -1</div> corresponding to eigen value λ=4 is:", options: ["[[1], [2]]", "[[1], [1]]", "[[1], [-2]]", "[[2], [-1]]"], correct: 0 },
                { question: "For a 3x3 matrix, what is the maximum number of distinct eigen values it can have?", options: ["3", "2", "1", "4"], correct: 0 }
            ]}
        ];

        // ==================== STATE ====================
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let isReviewMode = false;
        let totalQuestions = 0;
        let correctCount = 0;
        let attemptedCount = 0;

        // Calculate total questions
        quizData.forEach(section => { totalQuestions += section.questions.length; });
        userAnswers = new Array(totalQuestions).fill(null);

        // ==================== BACKGROUND ANIMATION ====================
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        function createParticles() {
            particles = [];
            const num = Math.min(50, Math.floor((canvas.width * canvas.height) / 20000));
            for (let i = 0; i < num; i++) {
                particles.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    r: Math.random() * 1.5 + 0.5, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3
                });
            }
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.1, p.r), 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 245, 255, 0.6)'; ctx.fill();
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
            });
            requestAnimationFrame(draw);
        }
        window.addEventListener('resize', () => { resizeCanvas(); createParticles(); });
        resizeCanvas(); createParticles();
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) draw();

        // ==================== QUIZ LOGIC ====================
        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            initQuiz();
        }

        function initQuiz() {
            currentQuestionIndex = 0;
            userAnswers = new Array(totalQuestions).fill(null);
            isReviewMode = false;
            correctCount = 0;
            attemptedCount = 0;
            renderAll();
        }

        function renderAll() {
            renderSectionTabs();
            renderNavDots();
            renderQuestion();
            updateProgress();
        }

        function renderSectionTabs() {
            const container = document.getElementById('section-tabs');
            let html = '';
            let qIndex = 0;
            quizData.forEach((section) => {
                const isActive = qIndex <= currentQuestionIndex && currentQuestionIndex < qIndex + section.questions.length;
                html += `<button class="section-tab ${isActive ? 'active' : ''}" onclick="goToSection(${qIndex})">${section.section}</button>`;
                qIndex += section.questions.length;
            });
            container.innerHTML = html;
        }

        function renderNavDots() {
            const container = document.getElementById('nav-dots');
            let html = '';
            let qIndex = 0;
            quizData.forEach((section) => {
                section.questions.forEach((q) => {
                    let classes = 'nav-dot';
                    if (userAnswers[qIndex] !== null) {
                        classes += userAnswers[qIndex] === q.correct ? ' correct' : ' incorrect';
                    }
                    if (qIndex === currentQuestionIndex) classes += ' current';
                    html += `<button class="${classes}" onclick="goToQuestion(${qIndex})"></button>`;
                    qIndex++;
                });
            });
            container.innerHTML = html;
        }

        function renderQuestion() {
            let qIndex = 0;
            let qData = null;
            let sectionName = '';

            for (const section of quizData) {
                for (const q of section.questions) {
                    if (qIndex === currentQuestionIndex) { qData = q; sectionName = section.section; break; }
                    qIndex++;
                }
                if (qData) break;
            }

            if (!qData) return;

            document.getElementById('section-label').textContent = sectionName;
            document.getElementById('question-number').textContent = `Question ${currentQuestionIndex + 1} of ${totalQuestions}`;
            document.getElementById('question-text').innerHTML = `<p>${qData.question}</p>`;

            const optionsContainer = document.getElementById('options-container');
            const isAnswered = userAnswers[currentQuestionIndex] !== null;
            
            optionsContainer.innerHTML = qData.options.map((opt, i) => {
                let classes = 'option-btn';
                let disabled = '';
                
                if (isAnswered) {
                    disabled = 'disabled';
                    if (i === qData.correct) classes += ' correct';
                    else if (userAnswers[currentQuestionIndex] === i) classes += ' incorrect';
                }

                return `
                    <button class="${classes}" onclick="selectAnswer(${i})" ${disabled}>
                        <span class="option-letter">${String.fromCharCode(65 + i)}</span>
                        <span>${opt}</span>
                    </button>
                `;
            }).join('');

            const feedbackArea = document.getElementById('feedback-area');
            if (isAnswered) {
                if (userAnswers[currentQuestionIndex] === qData.correct) {
                    feedbackArea.innerHTML = `<div class="feedback-badge correct">Correct!</div>`;
                } else {
                    feedbackArea.innerHTML = `<div class="feedback-badge incorrect">Incorrect. Correct Answer: ${String.fromCharCode(65 + qData.correct)}</div>`;
                }
            } else {
                feedbackArea.innerHTML = '';
            }

            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
            document.getElementById('next-btn').textContent = currentQuestionIndex === totalQuestions - 1 ? 'Finish' : 'Next';
        }

        function selectAnswer(index) {
            if (userAnswers[currentQuestionIndex] !== null) return;
            
            userAnswers[currentQuestionIndex] = index;
            attemptedCount++;

            let qIndex = 0;
            for (const section of quizData) {
                for (const q of section.questions) {
                    if (qIndex === currentQuestionIndex) {
                        if (index === q.correct) correctCount++;
                        break;
                    }
                    qIndex++;
                }
            }

            renderAll();
        }

        function updateProgress() {
            const answered = userAnswers.filter(a => a !== null).length;
            const percentage = (answered / totalQuestions) * 100;
            document.getElementById('progress-text').textContent = `${answered} / ${totalQuestions}`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('live-score').textContent = `Score: ${correctCount}/${attemptedCount}`;
        }

        function nextQuestion() {
            if (currentQuestionIndex < totalQuestions - 1) {
                currentQuestionIndex++;
                renderAll();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderAll();
            }
        }

        function goToQuestion(index) { currentQuestionIndex = index; renderAll(); }
        function goToSection(startIndex) { currentQuestionIndex = startIndex; renderAll(); }

        function showResults() {
            let incorrect = 0;
            let unanswered = 0;
            let qIndex = 0;

            quizData.forEach(section => {
                section.questions.forEach(q => {
                    if (userAnswers[qIndex] === null) unanswered++;
                    else if (userAnswers[qIndex] !== q.correct) incorrect++;
                    qIndex++;
                });
            });

            const score = totalQuestions > 0 ? Math.round((correctCount / totalQuestions) * 100) : 0;

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');

            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('incorrect-count').textContent = incorrect;
            document.getElementById('unanswered-count').textContent = unanswered;
            document.getElementById('score-value').textContent = `${score}%`;
            document.getElementById('score-circle').style.setProperty('--score', score);
        }

        function reviewAnswers() {
            isReviewMode = true;
            currentQuestionIndex = 0;
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            renderAll();
        }

        function restartQuiz() {
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
