<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Systems Diagnostic Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #01050e;
            --bg-panel: rgba(8, 18, 35, 0.75);
            --primary-neon: #00f3ff;
            --secondary-neon: #4d79ff;
            --accent-glow: rgba(0, 243, 255, 0.6);
            --text-bright: #e0f7fa;
            --text-dim: #81d4fa;
            --success: #00ff9d;
            --error: #ff3366;
            --border-tech: rgba(0, 243, 255, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-bright);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Dynamic Background (Canvas Layer) --- */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #0a192f 0%, #000000 100%);
        }

        /* --- Main UI Container --- */
        .container {
            width: 90%;
            max-width: 900px;
            background: var(--bg-panel);
            border: 1px solid var(--border-tech);
            border-radius: 12px;
            backdrop-filter: blur(20px);
            box-shadow: 
                0 0 40px rgba(0, 243, 255, 0.08),
                0 0 80px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            margin: 20px;
        }

        /* Decorative Holographic Corners */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent 40%, rgba(0, 243, 255, 0.03) 50%, transparent 60%);
            pointer-events: none;
            background-size: 200% 200%;
            animation: hologramShine 8s linear infinite;
        }

        @keyframes hologramShine {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 200%; }
        }

        /* --- Header --- */
        .header {
            padding: 25px 30px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            background: rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 1.6rem;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--primary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .sub-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            color: var(--secondary-neon);
            letter-spacing: 4px;
            margin-top: 5px;
            opacity: 0.8;
        }

        .progress-bar {
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            width: 100%;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary-neon), var(--primary-neon));
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px var(--primary-neon);
        }

        /* --- Quiz Area --- */
        .quiz-area {
            padding: 40px;
            min-height: 400px;
        }

        .question-counter {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85em;
            color: var(--primary-neon);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.9;
        }
        
        .question-counter span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary-neon);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-neon);
        }

        .question-text {
            font-size: 1.4em;
            font-weight: 600;
            margin-bottom: 35px;
            line-height: 1.7;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- Option Buttons --- */
        .option-btn {
            padding: 18px 25px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            text-align: right;
            font-size: 1.1em;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        /* Hover Glow Effect */
        .option-btn:hover:not(.disabled) {
            background: rgba(0, 243, 255, 0.05);
            border-color: var(--primary-neon);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 243, 255, 0.05);
            transform: translateX(-5px);
        }

        /* Selection State */
        .option-btn.selected {
            border-color: var(--primary-neon);
            background: rgba(0, 243, 255, 0.1);
        }

        /* Correct State */
        .option-btn.correct {
            background: rgba(0, 255, 157, 0.1);
            border-color: var(--success);
            color: var(--success);
            box-shadow: 0 0 25px rgba(0, 255, 157, 0.15);
        }

        /* Wrong State */
        .option-btn.wrong {
            background: rgba(255, 51, 102, 0.1);
            border-color: var(--error);
            color: var(--error);
            box-shadow: 0 0 25px rgba(255, 51, 102, 0.15);
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
            40%, 60% { transform: translate3d(3px, 0, 0); }
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.5;
        }

        /* --- Navigation --- */
        .navigation {
            display: flex;
            justify-content: space-between;
            padding: 25px 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.3);
        }

        .nav-btn {
            padding: 12px 35px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85em;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .btn-next {
            background: var(--primary-neon);
            border-color: var(--primary-neon);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        
        .btn-next:hover {
            background: #fff;
            box-shadow: 0 0 30px var(--primary-neon);
        }

        .nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            border-color: #333;
        }

        /* --- Result Screen --- */
        .result-screen {
            padding: 60px 40px;
            text-align: center;
        }

        .score-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 3px solid rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 3em;
            color: var(--primary-neon);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.1);
            position: relative;
        }
        
        /* Scanner Effect */
        .score-circle::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 5px;
            background: var(--primary-neon);
            box-shadow: 0 0 15px var(--primary-neon);
            animation: scan 2s linear infinite;
            opacity: 0.5;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .review-list {
            text-align: right;
            margin-top: 40px;
            max-height: 350px;
            overflow-y: auto;
            padding-left: 10px;
        }

        .review-list::-webkit-scrollbar {
            width: 4px;
        }
        .review-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .review-list::-webkit-scrollbar-thumb {
            background: var(--primary-neon);
            border-radius: 2px;
        }

        .review-item {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            border-right: 3px solid #555;
            font-size: 0.95em;
            backdrop-filter: blur(5px);
        }

        .review-item.correct { border-color: var(--success); }
        .review-item.wrong { border-color: var(--error); }

        .hidden { display: none; }
        
        /* Responsive */
        @media (max-width: 600px) {
            .quiz-area { padding: 20px; }
            .navigation { padding: 15px 20px; }
            h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Neural Network/Particles -->
    <canvas id="bgCanvas"></canvas>

<div class="container">
    <div class="header">
        <h2>Digital Logic Systems</h2>
        <div class="sub-header">INTELLIGENCE ASSESSMENT PROTOCOL</div>
    </div>
    <div class="progress-bar">
        <div class="progress-fill" id="progressBar"></div>
    </div>

    <!-- Quiz Screen -->
    <div class="quiz-area" id="quizScreen">
        <div class="question-counter" id="qCounter"><span></span></div>
        <div class="question-text" id="qText"></div>
        <div class="options-container" id="optionsContainer"></div>
    </div>

    <div class="navigation" id="navArea">
        <button class="nav-btn" id="prevBtn" onclick="changeQuestion(-1)">Back</button>
        <button class="nav-btn btn-next" id="nextBtn" onclick="changeQuestion(1)">Next</button>
    </div>

    <!-- Result Screen -->
    <div class="result-screen hidden" id="resultScreen">
        <h2 style="font-family: 'Orbitron'; color: #fff; font-size: 1.2rem; letter-spacing: 2px;">ANALYSIS COMPLETE</h2>
        <div class="score-circle" id="scoreCircle">0%</div>
        <p id="scoreText" style="color: var(--text-dim); font-size: 1.1em; margin-bottom: 30px;"></p>
        <button class="nav-btn btn-next" onclick="restartQuiz()">Reinitialize</button>
        
        <div class="review-list" id="reviewList"></div>
    </div>
</div>

<script>
    // --- Background Animation Logic (Particles & Neural Net) ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.speedX = Math.random() * 0.5 - 0.25;
            this.speedY = Math.random() * 0.5 - 0.25;
            this.color = `rgba(0, 243, 255, ${Math.random() * 0.5 + 0.2})`;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
            if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const numParticles = Math.floor((canvas.width * canvas.height) / 9000);
        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }
    }

    function connectParticles() {
        const maxDistance = 120;
        for (let a = 0; a < particles.length; a++) {
            for (let b = a; b < particles.length; b++) {
                const dx = particles[a].x - particles[b].x;
                const dy = particles[a].y - particles[b].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < maxDistance) {
                    const opacity = 1 - (distance / maxDistance);
                    ctx.strokeStyle = `rgba(0, 243, 255, ${opacity * 0.15})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(particles[a].x, particles[a].y);
                    ctx.lineTo(particles[b].x, particles[b].y);
                    ctx.stroke();
                }
            }
        }
    }

    function animateBg() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw connecting lines first (background)
        connectParticles();
        
        // Draw particles
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animateBg);
    }
    initParticles();
    animateBg();

    // --- Quiz Logic ---
    const questions = [
        // --- MCQ Questions ---
        { q: "When was the transistor invented?", options: ["1930s", "1940s", "1950s", "1960s"], answer: 1 },
        { q: "According to Moore's Law, how often does computer power double?", options: ["Every 6–12 months", "Every 12–18 months", "Every 18–24 months", "Every 2–3 years"], answer: 2 },
        { q: "What are the two main technology types used to categorize Integrated Circuits (ICs)?", options: ["SSI and MSI", "DIP and SMT", "TTL and CMOS", "NPN and PNP"], answer: 2 },
        { q: "Which IC package style utilizes Through-Hole Technology (THT)?", options: ["SMT", "QFP", "DIP", "LSI"], answer: 2 },
        { q: "Which logic gate outputs a '1' only when both of its inputs are '1'?", options: ["OR", "NOT", "NAND", "AND"], answer: 3 },
        { q: "What is the standard 74-Series TTL IC number for a Quad 2-input AND Gate?", options: ["7404", "7408", "7432", "7400"], answer: 1 },
        { q: "What is the standard 74-Series TTL IC number for Hex Inverters (NOT gates)?", options: ["7404", "7408", "7432", "7400"], answer: 0 },
        { q: "Which TTL logic sub-family is known for having a 'good speed-power ratio'?", options: ["Standard TTL", "Low Power TTL", "Advanced Schottky (74AS)", "Low-Power Schottky (74LS)"], answer: 3 },
        { q: "In basic digital logic systems, what does a '0' bit represent?", options: ["TRUE / ON", "TRUE / OFF", "FALSE / ON", "FALSE / OFF"], answer: 3 },
        { q: "A transistor operates like a valve controlling water flow; it can act as an amplifier or a:", options: ["Resistor", "Battery", "Switch", "Capacitor"], answer: 2 },
        { q: "What is the output of a NAND gate if both of its inputs are '1'?", options: ["1", "0", "High", "None of the above"], answer: 1 },
        { q: "What is the standard 74-Series IC number for a Quad 2-input NAND Gate?", options: ["7400", "7402", "7404", "7408"], answer: 0 },
        { q: "Which of the following is considered a 'Universal Gate' because it can be used to build AND, OR, and NOT operations?", options: ["AND", "OR", "NAND", "XOR"], answer: 2 },
        { q: "A NOR gate is equivalent to which combination of basic logic gates?", options: ["AND followed by NOT", "OR followed by NOT", "NOT followed by OR", "XOR followed by NOT"], answer: 1 },
        { q: "Which standard IC contains Quad 2-input NOR gates?", options: ["7432", "7486", "7402", "7400"], answer: 2 },
        { q: "According to the truth table for an XOR gate, when will the output be '1'?", options: ["When both inputs are the same", "When the inputs are different", "When both inputs are 1", "When both inputs are 0"], answer: 1 },
        { q: "What is the correct Boolean expression for an XOR gate (A ⊕ B)?", options: ["AB + A'B'", "(A+B)'", "A'B + AB'", "A' + B'"], answer: 2 },
        { q: "What is the standard IC number for Quad 2-input XOR Gates?", options: ["7402", "7486", "7432", "7400"], answer: 1 },
        { q: "What is the correct order of operations when evaluating Boolean Algebra expressions?", options: ["AND > OR > NOT", "NOT > AND > OR", "OR > AND > NOT", "NOT > OR > AND"], answer: 1 },
        { q: "According to DeMorgan's Theorem, what is the equivalent expression for (x • y)'?", options: ["x' • y'", "x + y", "(x + y)'", "x' + y'"], answer: 3 },
        { q: "What does 'SOP' stand for in digital logic design?", options: ["Sum of Products", "System of Products", "Sequence of Programs", "Sum of Parts"], answer: 0 },
        { q: "How many cells are in a Karnaugh map used for a 3-variable function?", options: ["4", "8", "12", "16"], answer: 1 },
        { q: "When grouping 1s in a Karnaugh map to simplify an expression, which group size is NOT valid?", options: ["2", "4", "6", "8"], answer: 2 },
        { q: "A logic circuit that performs arithmetic addition on two single binary bits is called a:", options: ["Full Adder", "Multiplexer", "Decoder", "Half Adder"], answer: 3 },
        { q: "What are the two outputs produced by a Half Adder circuit?", options: ["Sum and Difference", "Carry In and Carry Out", "Sum and Carry", "High and Low"], answer: 2 },
        { q: "Which logic gate is used to determine the 'Sum' output in a Half Adder?", options: ["AND", "OR", "NAND", "XOR"], answer: 3 },
        { q: "A Full Adder is designed to perform the addition of how many single bits?", options: ["Two", "Three", "Four", "Eight"], answer: 1 },
        { q: "A logic circuit that has n inputs and 2ⁿ outputs and detects a specific binary combination is a:", options: ["Encoder", "Decoder", "Multiplexer", "Adder"], answer: 1 },
        { q: "Which standard IC is commonly used as a BCD to Seven-Segment decoder?", options: ["74LS04", "74LS08", "74LS47", "74LS32"], answer: 2 },
        { q: "Which combinational circuit allows you to select a single data line from many data lines to pass to the output?", options: ["Decoder", "Encoder", "Full Adder", "Multiplexer"], answer: 3 },
        { q: "Which type of logic circuit takes past output values along with present inputs into account?", options: ["Combinational", "Sequential", "Arithmetic", "Multiplexed"], answer: 1 },
        { q: "Sequential logic circuits require a ____ to store the previous state of a circuit.", options: ["Multiplexer", "Memory Element", "Decoder", "Full Adder"], answer: 1 },
        { q: "In an SR latch, what is the state when both Set and Reset inputs are 1?", options: ["Output is 0", "Output is 1", "Previous state held", "Invalid / Undefined"], answer: 3 },
        { q: "What is the primary difference between a latch and a flip-flop?", options: ["Latches are edge-triggered", "Latches are level-sensitive, flip-flops are edge-triggered", "Flip-flops do not use a clock", "Latches are synchronous"], answer: 1 },
        { q: "If the period of a clock signal is T, what is its frequency?", options: ["F = T", "F = T²", "F = 1/T", "F = 1 + T"], answer: 2 },
        { q: "How is positive-edge triggering indicated on a flip-flop symbol?", options: ["Bubble", "Triangle", "Square", "Wavy line"], answer: 1 },
        { q: "How is negative-edge triggering indicated?", options: ["Triangle preceded by a bubble", "Only a circle", "Only a triangle", "Straight line"], answer: 0 },
        { q: "Which component uses one data input (D) and one enable input (E) to solve the invalid state problem of the SR latch?", options: ["JK Latch", "T Latch", "D Latch", "Master-Slave Latch"], answer: 2 },
        { q: "In which counter is the clock signal only applied to the first flip-flop?", options: ["Synchronous Counter", "Ripple Counter", "Ring Counter", "Decade Counter"], answer: 1 },
        { q: "What defines a synchronous counter?", options: ["Different clocks", "No clock", "All flip-flops share the same clock", "Only first flip-flop has a clock"], answer: 2 },
        { q: "Which terminal of a BJT acts as the control valve?", options: ["Emitter", "Collector", "Base", "Source"], answer: 2 },
        { q: "In SN74LS08N, what does LS denote?", options: ["Logical System", "Low-Power Schottky", "Large Scale", "Low Speed"], answer: 1 },
        { q: "A NAND gate is logically equivalent to:", options: ["Negative AND", "Negative OR", "Positive OR", "Positive AND"], answer: 1 },
        { q: "A NOR gate is logically equivalent to a:", options: ["Negative AND", "Negative OR", "Inverted XOR", "Positive AND"], answer: 0 },
        { q: "What is the involution theorem?", options: ["x + 0 = x", "x • 1 = x", "(x')' = x", "x • x = x"], answer: 2 },
        { q: "SOP is formed by taking the sum of all ____ that make the output true.", options: ["Maxterms", "Variables", "Minterms", "Equivalents"], answer: 2 },
        { q: "When grouping 1s in a Karnaugh map, which rule applies?", options: ["Groups can be diagonal", "Groups must be odd", "Groups can intersect and share 1s", "Every 1 isolated"], answer: 2 },
        { q: "The simplified Carry Out (Cout) of a Full Adder is:", options: ["A ⊕ B ⊕ Cin", "BCin + AB + ACin", "AB + Cin", "A'B' + AB"], answer: 1 },
        { q: "How many AND gates are required to build a 4-to-16 decoder?", options: ["4", "8", "16", "32"], answer: 2 },
        { q: "If input line 7 is High on an 8×3 priority encoder, what is the binary output?", options: ["100", "11", "111", "0"], answer: 2 },
        
        // --- More MCQs (51-100) ---
        { q: "Which combinational circuit is essentially the reverse operation of a decoder?", options: ["Multiplexer", "Full Adder", "Encoder", "Flip-Flop"], answer: 2 },
        { q: "Why are edge-triggered flip-flops preferred over level-sensitive latches in complex synchronous systems?", options: ["Latches require more gates", "Level-sensitivity can lead to unpredictable behavior and incorrect states", "Flip-flops consume less power", "Latches cannot store data"], answer: 1 },
        { q: "Which component forms the basic building blocks of all other types of flip-flops?", options: ["Multiplexer", "SR Latch", "Decoder", "D Latch"], answer: 1 },
        { q: "In a D Latch, what happens when the Enable (E) signal is inactive (low)?", options: ["Output Q goes to 0", "Output Q goes to 1", "The latch holds its previous value", "The latch becomes transparent"], answer: 2 },
        { q: "What characterizes a Ripple Counter?", options: ["All flip-flops share a clock", "Uses only combinational logic", "Output of one flip-flop serves as the clock for the next", "Cannot count above 4"], answer: 2 },
        { q: "Which is the most common type of Bipolar Junction Transistor (BJT) mentioned in the labs?", options: ["NPN", "PNP", "CMOS", "FET"], answer: 0 },
        { q: "In the IC part number 'SN74LS08N', what does the 'N' indicate?", options: ["Negative logic", "Manufacturer (National)", "Package Style (DIP)", "Nano-scale"], answer: 2 },
        { q: "What is the Boolean expression for an XNOR gate?", options: ["A ⊕ B", "A'B + AB'", "A'B'", "(A ⊕ B)'"], answer: 3 },
        { q: "According to the ANSI/IEC symbol table, the output of a NAND gate is at logic 0 when:", options: ["Any input is 0", "All inputs are 0", "All inputs are 1", "Any input is 1"], answer: 2 },
        { q: "To design a 4-input NAND gate using DeMorgan's law, you need two 2-input NAND gates and one:", options: ["2-input OR gate", "2-input AND gate", "2-input XOR gate", "Inverter"], answer: 0 },
        { q: "According to Boolean Algebra Theorem 1, what does x + 0 evaluate to?", options: ["0", "1", "x", "x'"], answer: 2 },

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = new Array(questions.length).fill(false);
    let userAnswers = new Array(questions.length).fill(null);

    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const navArea = document.getElementById('navArea');
    const qCounter = document.getElementById('qCounter');
    const qText = document.getElementById('qText');
    const optionsContainer = document.getElementById('optionsContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        
        // Update Counter & Progress
        qCounter.innerHTML = `<span></span> QUERY ${currentQuestionIndex + 1} OF ${questions.length}`;
        const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
        progressBar.style.width = progress + "%";

        // Set Question Text
        qText.innerText = q.q;

        // Clear Options
        optionsContainer.innerHTML = '';

        // Create Options
        q.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = () => selectOption(index);
            
            // Restore state if already answered
            if (answered[currentQuestionIndex]) {
                btn.classList.add('disabled');
                if (index === q.answer) {
                    btn.classList.add('correct');
                }
                if (userAnswers[currentQuestionIndex] === index) {
                    if (index !== q.answer) {
                        btn.classList.add('wrong');
                    }
                }
            }
            
            optionsContainer.appendChild(btn);
        });

        // Navigation Buttons Logic
        prevBtn.disabled = currentQuestionIndex === 0;
        
        if (currentQuestionIndex === questions.length - 1) {
            nextBtn.innerText = "Finalize";
            nextBtn.className = "nav-btn btn-next";
        } else {
            nextBtn.innerText = "Next";
            nextBtn.className = "nav-btn btn-next";
        }
    }

    function selectOption(index) {
        if (answered[currentQuestionIndex]) return; 

        answered[currentQuestionIndex] = true;
        userAnswers[currentQuestionIndex] = index;

        const q = questions[currentQuestionIndex];
        const buttons = optionsContainer.children;

        if (index === q.answer) {
            buttons[index].classList.add('correct');
            score++;
        } else {
            buttons[index].classList.add('wrong');
            buttons[q.answer].classList.add('correct'); 
        }

        for (let btn of buttons) {
            btn.classList.add('disabled');
        }
    }

    function changeQuestion(direction) {
        if (direction === 1) {
            if (currentQuestionIndex === questions.length - 1) {
                showResults();
            } else {
                currentQuestionIndex++;
                loadQuestion();
            }
        } else {
            currentQuestionIndex--;
            loadQuestion();
        }
        window.scrollTo(0, 0);
    }

    function showResults() {
        quizScreen.classList.add('hidden');
        navArea.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        progressBar.style.width = "100%";

        const percentage = Math.round((score / questions.length) * 100);
        document.getElementById('scoreCircle').innerText = percentage + "%";
        document.getElementById('scoreText').innerText = `System Efficiency: ${score}/${questions.length} Processes Executed Successfully`;

        const reviewList = document.getElementById('reviewList');
        reviewList.innerHTML = '';

        questions.forEach((q, i) => {
            const div = document.createElement('div');
            const status = userAnswers[i] === q.answer ? 'correct' : 'wrong';
            div.className = `review-item ${status}`;
            
            const userAnsText = userAnswers[i] !== null ? q.options[userAnswers[i]] : "NULL DATA";
            const correctAnsText = q.options[q.answer];

            div.innerHTML = `
                <p style="font-weight:bold; color:#fff; margin-bottom:8px;">QUERY #${i+1}: ${q.q}</p>
                <p style="margin:0; color:var(--error);">User Input: ${userAnsText}</p>
                <p style="margin:0; color:var(--success);">Required Output: ${correctAnsText}</p>
            `;
            reviewList.appendChild(div);
        });
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        answered = new Array(questions.length).fill(false);
        userAnswers = new Array(questions.length).fill(null);
        
        resultScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        navArea.classList.remove('hidden');
        
        loadQuestion();
    }

    loadQuestion();

</script>
