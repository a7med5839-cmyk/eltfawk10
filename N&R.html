<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتشف الجذور الرياضي | Numerical Methods</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a; /* midnight blue background */
            --card-bg: rgba(30, 41, 59, 0.8); /* partially transparent for glass effect */
            --accent-blue: #38bdf8; /* electric blue accent */
            --text-color: #f8fafc;
            --input-bg: #334155;
            --border-color: rgba(255,255,255,0.08);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* تحسين تجربة اللمس على الموبايل */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* حاوية المدخلات (تصبح عمودية في الشاشات الصغيرة) */
        .calculator-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
        }

        /* تحسين مظهر الرسم البياني وتجاوبه */
        .chart-card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            min-height: 300px;
            height: 50vh; /* Responsive height based on viewport */
        }

        h1 { text-align: center; color: var(--accent-blue); margin-top: 0; font-size: 1.8rem; }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 0.95rem; font-weight: 500; }

        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: var(--input-bg);
            color: white;
            font-size: 1rem;
            transition: 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        /* ترتيب مدخلات Bisection في سطر واحد على الشاشات الكبيرة */
        .params-row {
            display: flex;
            gap: 15px;
        }

        .params-row .input-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4);
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 10px;
            display: none;
            text-align: center;
        }

        #root-val {
            display: block;
            font-size: 2rem;
            color: var(--accent-blue);
            font-weight: bold;
            margin-top: 5px;
        }

        /* ---------- MEDIA QUERIES للتجاوب (Responsiveness) ---------- */
        
        /* للهواتف المحمولة */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .calculator-card { padding: 1.5rem; }
            h1 { font-size: 1.5rem; }
            .params-row { flex-direction: column; gap: 0; }
            #root-val { font-size: 1.6rem; }
            .chart-card { height: 40vh; }
        }

        /* للأجهزة اللوحية (التابلت) */
        @media (min-width: 601px) and (max-width: 1024px) {
            .main-container { max-width: 800px; }
            .chart-card { height: 45vh; }
        }
    </style>
</head>
<body>

<div class="main-container">
    
    <div class="calculator-card">
        <h1>  N&R</h1>
        
        <div class="input-group">
            <label>الدالة (f(x)) | مثال: x**3 - x - 2</label>
            <input type="text" id="equation" value="x**3 - x - 2" placeholder="أدخل الدالة هنا...">
        </div>

        <div class="input-group">
            <label>طريقة الحل</label>
            <select id="method" onchange="toggleInputs()">
                <option value="bisection">طريقة التنصيف (Bisection Method)</option>
                <option value="newton">طريقة نيوتن-رافسون (Newton-Raphson)</option>
            </select>
        </div>

        <div id="bisect-params">
            <div class="params-row">
                <div class="input-group">
                    <label>Xa (بداية المجال)</label>
                    <input type="number" id="xa" value="1" step="0.1">
                </div>
                <div class="input-group">
                    <label>Xb (نهاية المجال)</label>
                    <input type="number" id="xb" value="2" step="0.1">
                </div>
            </div>
        </div>

        <div id="newton-params" style="display:none">
            <div class="input-group">
                <label>Xi (القيمة الابتدائية)</label>
                <input type="number" id="xi" value="1.5" step="0.1">
            </div>
        </div>

        <button onclick="calculateAndDraw()">احسب وارسم البيان</button>

        <div id="result">
            <strong>الجذر التقريبي:</strong> <span id="root-val">...</span>
        </div>
    </div>

    <div class="chart-card">
        <canvas id="myChart"></canvas>
    </div>

</div>

<script>
    let myChartInstance = null; // للاحتفاظ بالرسم البياني لتحديثه

    function toggleInputs() {
        const method = document.getElementById('method').value;
        document.getElementById('bisect-params').style.display = method === 'bisection' ? 'block' : 'none';
        document.getElementById('newton-params').style.display = method === 'newton' ? 'block' : 'none';
    }

    // دالة لتقييم المعادلة
    function evaluateFunction(expr, xValue) {
        try {
            // تحويل x إلى القيمة الرقمية
            return eval(expr.replace(/x/g, `(${xValue})`));
        } catch(e) {
            return null;
        }
    }

    // حساب الجذر
    function calculateRoot(expr, method) {
        if(method === 'bisection') {
            let xa = parseFloat(document.getElementById('xa').value);
            let xb = parseFloat(document.getElementById('xb').value);
            if (evaluateFunction(expr, xa) * evaluateFunction(expr, xb) >= 0) {
                alert("طريقة التنصيف قد تفشل: f(xa) و f(xb) يجب أن يكونا متعاكسي الإشارة.");
                return null;
            }
            let xm = 0;
            for(let i=0; i<20; i++) {
                xm = (xa + xb) / 2;
                if(evaluateFunction(expr, xa) * evaluateFunction(expr, xm) < 0) xb = xm;
                else xa = xm;
            }
            return { root: xm, rangeX: [parseFloat(document.getElementById('xa').value), parseFloat(document.getElementById('xb').value)] };
        } else {
            let xi = parseFloat(document.getElementById('xi').value);
            let h = 0.00001;
            for(let i=0; i<15; i++) {
                let fx = evaluateFunction(expr, xi);
                let dfx = (evaluateFunction(expr, xi + h) - fx) / h;
                if(Math.abs(dfx) < 1e-10) break; // لتجنب القسمة على صفر
                xi = xi - (fx / dfx);
            }
            return { root: xi, rangeX: [xi - 2, xi + 2] }; // مجال الرسم حول الجذر
        }
    }

    // الرسم البياني
    function drawChart(expr, rootData) {
        const ctx = document.getElementById('myChart').getContext('2d');
        const startX = rootData.rangeX[0];
        const endX = rootData.rangeX[1];
        
        // إنشاء بيانات المنحنى
        let dataPoints = [];
        let labels = [];
        let minF = Infinity, maxF = -Infinity;
        const step = (endX - startX) / 100;
        
        for(let x = startX - 0.5; x <= endX + 0.5; x += step) {
            let y = evaluateFunction(expr, x);
            if (y !== null) {
                dataPoints.push({x: x, y: y});
                if(y < minF) minF = y;
                if(y > maxF) maxF = y;
            }
        }

        // تدمير الرسم القديم إذا وجد لتفادي التداخل
        if(myChartInstance) myChartInstance.destroy();

        // إنشاء رسم بياني جديد
        myChartInstance = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [
                    {
                        label: 'f(x)',
                        data: dataPoints,
                        borderColor: '#38bdf8', // Blue line
                        borderWidth: 2,
                        showLine: true,
                        fill: false,
                        pointRadius: 0
                    },
                    {
                        label: 'الجذر (Root)',
                        data: [{x: rootData.root, y: 0}],
                        backgroundColor: '#ef4444', // Red dot for root
                        pointRadius: 6,
                        pointHoverRadius: 8
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false, // Allows responsive height
                animation: { duration: 800, easing: 'easeInOutQuart' },
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        title: { display: true, text: 'X', color: '#94a3b8' },
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#94a3b8' }
                    },
                    y: {
                        title: { display: true, text: 'f(X)', color: '#94a3b8' },
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#94a3b8' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#f8fafc' } }
                }
            }
        });
    }

    // الدالة الرئيسية عند الضغط على الزر
    function calculateAndDraw() {
        const expr = document.getElementById('equation').value;
        const method = document.getElementById('method').value;

        // 1. احسب الجذر
        let rootData = calculateRoot(expr, method);
        if(!rootData) return; // الخروج في حال فشل الحساب

        // 2. اعرض النتيجة الرقمية
        document.getElementById('result').style.display = "block";
        document.getElementById('root-val').innerText = rootData.root.toFixed(6);

        // 3. ارسم المنحنى البياني
        drawChart(expr, rootData);
    }

    // رسم دالة افتراضية عند تحميل الصفحة
    window.onload = function() {
        calculateAndDraw();
    };
</script>

</body>
</html>
