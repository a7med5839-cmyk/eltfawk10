<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numerical Methods Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(145deg, #1e40af, #051773);
            --accent-color: #38bdf8;
            --glass-white: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.9)), 
                        url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            padding: 20px;
        }

        /* زر الرجوع */
        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            text-decoration: none;
            color: white;
            background: var(--primary-gradient);
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 1000;
            border: 1px solid rgba(255,255,255,0.2);
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .back-btn:hover {
            background: var(--accent-color);
            transform: scale(1.05);
            color: #0f172a;
        }

        /* حاوية الشبكة */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        /* تصميم الكارت */
        .btn-card {
            text-decoration: none;
            height: 200px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: var(--card-shadow);
        }

        .btn-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(56, 189, 248, 0.1), transparent);
            transition: 0.5s;
        }

        .btn-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-color);
            box-shadow: 0 20px 40px rgba(56, 189, 248, 0.2);
            background: rgba(30, 41, 59, 0.9);
        }

        .btn-card:hover::before {
            left: 100%;
        }

        /* صندوق الأيقونة المطور */
        .icon-box {
            width: 70px;
            height: 70px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: var(--accent-color);
            transition: 0.4s;
        }

        .btn-card:hover .icon-box {
            transform: rotate(-10deg) scale(1.1);
            background: var(--accent-color);
            color: #0f172a;
            box-shadow: 0 0 20px var(--accent-color);
        }

        .btn-label {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            text-align: center;
            letter-spacing: 1px;
        }

        /* التجاوب للموبايل */
        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .btn-card { height: 160px; }
            .icon-box { width: 55px; height: 55px; font-size: 24px; }
            .btn-label { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-right"></i> الرجوع</a>

    <div class="grid-container">
        <a href="curve-fitting.html" class="btn-card">
            <div class="icon-box">
                <i class="fas fa-bezier-curve"></i>
            </div>
            <span class="btn-label">Curve Fitting</span>
        </a>

        <a href="L$N$R.html" class="btn-card">
            <div class="icon-box">
                <i class="fas fa-calculator"></i>
            </div>
            <span class="btn-label">L$N$R</span>
        </a>

        <a href="N$R.html" class="btn-card">
            <div class="icon-box">
                <i class="fas fa-square-root-variable"></i>
            </div>
            <span class="btn-label">N$R</span>
        </a>

        <a href="F$S.html" class="btn-card">
            <div class="icon-box">
                <i class="fas fa-chart-area"></i>
            </div>
            <span class="btn-label">F$S</span>
        </a>
    </div>

</body>
</html>
